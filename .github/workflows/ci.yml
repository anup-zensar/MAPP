name: CI

on:
  pull_request:
    branches: [main, release, develop]
  push:
    branches: [main, release, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts a pull request or push changes. Documentation is read by no job, so a docs-only change skips them
  # all; a skipped job counts as passed for required checks. A push compares with the branch's last successful run,
  # so it also covers a run it cancelled; with no such run, or no readable diff, everything runs.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.parts.outputs.backend }}
      frontend: ${{ steps.parts.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Parts changed
        id: parts
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = push ]; then
            BASE="$(gh run list --workflow ci.yml --branch "$BRANCH" --event push --status success --limit 1 \
              --json headSha -q '.[0].headSha' || true)"
          fi
          backend=true frontend=true
          if files="$(git diff --name-only "$BASE" HEAD)"; then
            backend=false frontend=false
            while read -r file; do
              case "$file" in
                "" | *.md | docs/* | specs/* | .specify/* | .claude/* | .gitignore) ;;
                backend/api/openapi.yaml) backend=true frontend=true ;; # the web app's API types come from it
                backend/*) backend=true ;;
                frontend/*) frontend=true ;;
                *) backend=true frontend=true ;;
              esac
            done <<< "$files"
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend: $backend, frontend: $frontend"

  backend:
    name: backend
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.backend != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: backend
    # The scope-isolation tests run on PostgreSQL 18 (constitution VI, B9). Trust authentication is safe here:
    # the service is reachable only from this job, on the runner's loopback address, and holds only test data.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mapp
          POSTGRES_DB: mapp
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U mapp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format
        run: |
          unformatted="$(gofmt -s -l .; go run golang.org/x/tools/cmd/goimports@v0.52.0 -local mapp -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not formatted — run: golangci-lint fmt ./..."
            echo "$unformatted" | sort -u
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: backend
          # New and changed lines only, diffed with git: GitHub's pull-request diff API stops at 300 files.
          args: >-
            ${{ github.event_name == 'pull_request'
                && format('--new-from-merge-base=origin/{0}', github.base_ref)
                || format('--new-from-rev={0}', github.event.before) }}
      - name: Generated queries
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 vet
          stale="$(git status --porcelain -- internal/platform/database/sqlcdb)"
          if [ -n "$stale" ]; then
            echo "Generated queries are out of date — run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate"
            echo "$stale"
            exit 1
          fi
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://mapp@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          set -o pipefail
          go test -race -covermode=atomic -coverprofile=coverage.out ./... | tee go-test.txt
      # The success criteria's timings, which the race detector would distort; under -race these tests skip.
      - name: Timing tests
        run: >-
          go test -count=1
          -run 'TestQueryLog_50000Entries_SC006|TestQuery_StressYear_SC004|TestImport_FiveThousandRows_SC004|TestTransactions_TwentyThousand_SC004|TestHome_LargeScope_SC004'
          ./internal/history/ ./internal/allwork/ ./internal/financials/ ./internal/home/
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test
          path: |
            backend/go-test.txt
            backend/coverage.out
          retention-days: 30
          if-no-files-found: ignore

  frontend:
    name: frontend
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.frontend != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Format
        run: pnpm run format:check
      - name: Type check
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: API types
        run: pnpm run api:check
      - name: Test
        run: pnpm run test:coverage
      - name: Build
        run: pnpm run build
      - name: Audit
        run: pnpm audit --prod --audit-level high
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test
          path: |
            frontend/coverage/lcov.info
            frontend/test-results/junit.xml
          retention-days: 30
          if-no-files-found: ignore

  e2e:
    name: e2e
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.backend != 'false' || needs.changes.outputs.frontend != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    # The end-to-end tests run the API on PostgreSQL 18, seeded afresh by the test set-up (constitution VI).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mapp
          POSTGRES_DB: mapp
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U mapp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end
        run: pnpm run test:e2e
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: frontend/test-results/
          retention-days: 30
