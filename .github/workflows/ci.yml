name: CI

on:
  pull_request:
    branches: [main, release, develop]
  push:
    branches: [main, release, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format
        run: |
          unformatted="$(gofmt -s -l .; go run golang.org/x/tools/cmd/goimports@v0.52.0 -local mapp -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not formatted — run: golangci-lint fmt ./..."
            echo "$unformatted" | sort -u
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: backend
          only-new-issues: true
      - name: Test
        run: |
          set -o pipefail
          go test -race -covermode=atomic -coverprofile=coverage.out ./... | tee go-test.txt
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test
          path: |
            backend/go-test.txt
            backend/coverage.out
          retention-days: 30
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: API types
        run: npm run api:check
      - name: Test
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Audit
        run: npm audit --omit=dev --audit-level=high
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test
          path: |
            frontend/coverage/lcov.info
            frontend/test-results/junit.xml
          retention-days: 30
          if-no-files-found: ignore

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end
        run: npm run test:e2e
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: frontend/test-results/
          retention-days: 30

  repo-checks:
    name: repo-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
          MODULE_BRANCHES: plan-module
        run: |
          case "$BASE:$HEAD" in
            develop:feature/[0-9][0-9][0-9]-*|develop:docs/*|develop:fix/*) exit 0 ;;
            release:develop|release:fix/*) exit 0 ;;
            main:release) exit 0 ;;
          esac
          for module in $MODULE_BRANCHES; do
            if [ "$BASE:$HEAD" = "develop:$module" ]; then exit 0; fi
          done
          echo "'$HEAD' may not open a pull request into '$BASE'."
          echo "Into develop: feature/NNN-short-name, docs/..., fix/... or a module branch ($MODULE_BRANCHES)."
          echo "Into release: develop or fix/... Into main: release."
          exit 1
      - name: Dependency review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
