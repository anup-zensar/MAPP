name: CI

on:
  pull_request:
    branches: [main, release, develop]
  push:
    branches: [main, release, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# backend, frontend and e2e are the required checks (.github/rulesets). Each part's work is spread over jobs that run
# side by side, and the job named after the part fails when any of them failed.
jobs:
  # Which parts a pull request or push changes. Documentation is read by no job, so a docs-only change skips them
  # all; a skipped job counts as passed for required checks. A push compares with the branch's last successful run,
  # so it also covers a run it cancelled; with no such run, or no readable diff, everything runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.parts.outputs.backend }}
      frontend: ${{ steps.parts.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Parts changed
        id: parts
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = push ]; then
            BASE="$(gh run list --workflow ci.yml --branch "$BRANCH" --event push --status success --limit 1 \
              --json headSha -q '.[0].headSha' || true)"
          fi
          backend=true frontend=true
          if files="$(git diff --name-only "$BASE" HEAD)"; then
            backend=false frontend=false
            while read -r file; do
              case "$file" in
                "" | *.md | docs/* | specs/* | .specify/* | .claude/* | .gitignore) ;;
                backend/api/openapi.yaml) backend=true frontend=true ;; # the web app's API types come from it
                backend/*) backend=true ;;
                frontend/*) frontend=true ;;
                *) backend=true frontend=true ;;
              esac
            done <<< "$files"
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend: $backend, frontend: $frontend"

  backend-vet:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: &in-backend
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - &setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Format
        run: |
          unformatted="$(gofmt -s -l .; go run golang.org/x/tools/cmd/goimports@v0.52.0 -local mapp -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not formatted — run: golangci-lint fmt ./..."
            echo "$unformatted" | sort -u
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Generated queries
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 vet
          stale="$(git status --porcelain -- internal/platform/database/sqlcdb)"
          if [ -n "$stale" ]; then
            echo "Generated queries are out of date — run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate"
            echo "$stale"
            exit 1
          fi
      # The success criteria's timings, which the race detector would distort; under -race these tests skip.
      - name: Timing tests
        run: >-
          go test -count=1
          -run 'TestQueryLog_50000Entries_SC006|TestQuery_StressYear_SC004|TestImport_FiveThousandRows_SC004|TestTransactions_TwentyThousand_SC004|TestHome_LargeScope_SC004'
          ./internal/history/ ./internal/allwork/ ./internal/financials/ ./internal/home/

  backend-lint:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    defaults: *in-backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - *setup-go
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          install-only: true
      # The configured linters without the formatters, which the Format step checks and which take most of the time
      # here. New and changed lines only, diffed with git: GitHub's pull-request diff API stops at 300 files.
      - name: Lint
        env:
          NEW: >-
            ${{ github.event_name == 'pull_request'
                && format('--new-from-merge-base=origin/{0}', github.base_ref)
                || format('--new-from-rev={0}', github.event.before) }}
        run: golangci-lint run --enable-only="$(golangci-lint linters --json | jq -r '[.Enabled[].name] | join(",")')" "$NEW"
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  backend-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults: *in-backend
    # The scope-isolation tests run on PostgreSQL 18 (constitution VI, B9). Trust authentication is safe here:
    # the service is reachable only from this job, on the runner's loopback address, and holds only test data.
    services: &postgres
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mapp
          POSTGRES_DB: mapp
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U mapp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - *setup-go
      # Each group of the slowest packages has a shard of its own, sized by CI time; the last shard tests every
      # other package, so a new one is never left out.
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://mapp@127.0.0.1:5432/postgres?sslmode=disable
          INDEX: ${{ strategy.job-index }}
          TOTAL: ${{ strategy.job-total }}
        run: |
          set -o pipefail
          groups=(
            "app budget campaign people financials plan"
            "allwork approval settings access"
            "purchaserequest home activity lineitem"
          )
          [ "${#groups[@]}" -eq $((TOTAL - 1)) ] || { echo "Give the matrix one shard per group, plus one."; exit 1; }
          if [ "$INDEX" -lt "${#groups[@]}" ]; then
            packages="$(printf 'mapp/internal/%s\n' ${groups[INDEX]})"
          else
            packages="$(go list ./... | grep -vxF "$(printf 'mapp/internal/%s\n' ${groups[*]})")"
          fi
          go test -race -covermode=atomic -coverprofile=coverage.out $packages | tee go-test.txt
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-${{ matrix.shard }}
          path: |
            backend/go-test.txt
            backend/coverage.out
          retention-days: 30
          if-no-files-found: ignore

  backend:
    needs: [changes, backend-vet, backend-lint, backend-test]
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - &fail-if-a-job-failed
        name: Fail if a job it needs failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  frontend-checks:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: &in-frontend
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - &setup-node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - &install
        name: Install
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Format
        run: pnpm run format:check
      - name: Type check
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      - name: API types
        run: pnpm run api:check
      - name: Build
        run: pnpm run build
      - name: Audit
        run: pnpm audit --prod --audit-level high

  frontend-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults: *in-frontend
    steps:
      - uses: actions/checkout@v7
      - *setup-node
      - *install
      # A worker on every core: Vitest's default keeps one free for itself, which here only waits for the workers.
      - name: Test
        run: pnpm run test:coverage --shard=${{ matrix.shard }}/${{ strategy.job-total }} --maxWorkers=100% --reporter=blob
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-blob-${{ matrix.shard }}
          path: frontend/.vitest/blob/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore

  # Also merges the shards' results into one test report and one coverage report.
  frontend:
    needs: [changes, frontend-checks, frontend-test]
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: *in-frontend
    steps:
      - uses: actions/checkout@v7
      - *setup-node
      - *install
      - uses: actions/download-artifact@v8
        with:
          pattern: frontend-blob-*
          path: frontend/.vitest/blob
          merge-multiple: true
      - name: Test results
        run: pnpm run test:coverage --merge-reports
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test
          path: |
            frontend/coverage/lcov.info
            frontend/test-results/junit.xml
          retention-days: 30
          if-no-files-found: ignore
      - *fail-if-a-job-failed

  e2e-test:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.backend != 'false' || needs.changes.outputs.frontend != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults: *in-frontend
    # The end-to-end tests run the API on PostgreSQL 18, seeded afresh by the test set-up (constitution VI).
    services: *postgres
    steps:
      - uses: actions/checkout@v7
      - *setup-go
      - *setup-node
      - *install
      # The tests run headless, which needs only Chromium's headless shell.
      - name: Install browser
        run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: End-to-end
        run: pnpm run test:e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.shard }}
          path: frontend/test-results/
          retention-days: 30

  e2e:
    needs: [changes, e2e-test]
    if: ${{ !cancelled() && (needs.changes.outputs.backend != 'false' || needs.changes.outputs.frontend != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - *fail-if-a-job-failed
