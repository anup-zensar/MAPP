server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The API refuses cross-site and non-local requests, so it must see the browser's own host and port.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
        # The API counts sign-in attempts per client address (038 FR-014) and trusts only this proxy.
        proxy_set_header X-Forwarded-For $remote_addr;
        # The largest upload the API accepts (workbook import, 038 FR-011).
        client_max_body_size 8m;
    }

    # The headers of security-headers.ts (038 FR-015) are repeated in each location: nginx drops the
    # server's add_header lines in a location with its own. A test keeps them equal; the API sends its own.
    # Vite puts a content hash in every asset name, so an asset never changes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-nVTUJbrSqIkv5drP7mF7wHu4n7tN4cGDDVhWkTRqx9o='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-nVTUJbrSqIkv5drP7mF7wHu4n7tN4cGDDVhWkTRqx9o='; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
