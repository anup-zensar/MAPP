      operationId: previewActivitySplit
      summary: Both activities as a split would leave them (saves nothing)
      description: Problems are answered in the body (200) so the dialog can show them while typing; sides are null when they cannot be worked out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivitySplitRequest"
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivitySplitPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/activities/{activityId}/split:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    post:
      tags: [Split activity]
      operationId: splitActivity
      summary: Split the activity, all or nothing (data-model §3.6)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivitySplitRequest"
      responses:
        "201":
          description: The original and the new activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivitySplitResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/all-work/breakdown:
    get:
      tags:
        - All work
      operationId: getAllWorkBreakdown
      summary: The Breakdown view (and the plan page's Planned cost by card) for a filter set
      description: |
        Takes every filter parameter of getAllWork. With amountsIn=plan and exactly one plan filtered, amounts
        are in that plan's currency; otherwise in the display currency (amountsIn=plan with several plans
        answers validation_failed on amountsIn).
      parameters:
        - $ref: "#/components/parameters/AllWorkYear"
        - $ref: "#/components/parameters/AllWorkYearFrom"
        - $ref: "#/components/parameters/AllWorkYearTo"
        - $ref: "#/components/parameters/AllWorkPlan"
        - $ref: "#/components/parameters/AllWorkPlanStatus"
        - $ref: "#/components/parameters/AllWorkContainerStatus"
        - $ref: "#/components/parameters/AllWorkActivityStatus"
        - $ref: "#/components/parameters/AllWorkOwner"
        - $ref: "#/components/parameters/AllWorkTeam"
        - $ref: "#/components/parameters/AllWorkBusinessUnit"
        - $ref: "#/components/parameters/AllWorkActivityType"
        - $ref: "#/components/parameters/AllWorkStrategic"
        - $ref: "#/components/parameters/AllWorkPlanType"
        - $ref: "#/components/parameters/AllWorkPlanCurrency"
        - $ref: "#/components/parameters/AllWorkAttr"
        - $ref: "#/components/parameters/AllWorkShowLevels"
        - $ref: "#/components/parameters/AllWorkSearch"
        - $ref: "#/components/parameters/AllWorkBy"
        - $ref: "#/components/parameters/AllWorkThenBy"
        - $ref: "#/components/parameters/AllWorkAmountsIn"
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllWorkBreakdown"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  # Feature 017 Approval rules (merged 2026-10-20, D-298)
  /api/v1/approval-rule-options:
    get:
      tags: [Approval workflows]
      operationId: getApprovalRuleOptions
      summary: What a level's rule may name — activity types, business units and roles (FR-001, FR-005)
      description: Roles are feature 014's roles that include approvals.decide.
      responses:
        "200":
          description: The choices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalRuleOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/approval-delegations:
    get:
      tags: [Approval delegations]
      operationId: listApprovalDelegations
      summary: Delegations of the signed-in person (as delegating person or delegate), or everyone's (scope=all needs workflows.manage, else 403) (FR-024)
      parameters:
        - name: scope
          in: query
          required: false
          schema:
            type: string
            enum: [mine, all]
            default: mine
      responses:
        "200":
          description: Current and planned first (by first day), then ended and cancelled (latest last day first).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDelegationPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Approval delegations]
      operationId: createApprovalDelegation
      summary: Delegate approvals for a date range (FR-022)
      description: personId defaults to the signed-in person; another person needs workflows.manage (403 forbidden). Every field problem at once (400 validation_failed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDelegationCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDelegation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/approval-delegations/{delegationId}:
    patch:
      tags: [Approval delegations]
      operationId: updateApprovalDelegation
      summary: Change a planned or current delegation (FR-024)
      description: Only the fields to change plus the version (D-203). The delegating person, or someone holding workflows.manage (else 403 forbidden); ended and cancelled ones answer 409 not_allowed.
      parameters:
        - $ref: "#/components/parameters/DelegationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDelegationUpdate"
      responses:
        "200":
          description: The delegation after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDelegation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/approval-delegations/{delegationId}/cancel:
    post:
      tags: [Approval delegations]
      operationId: cancelApprovalDelegation
      summary: Cancel a planned or current delegation; it is kept for the audit trail (FR-024)
      parameters:
        - $ref: "#/components/parameters/DelegationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalDelegationCancel"
      responses:
        "200":
          description: The cancelled delegation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalDelegation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/approvals/monitoring:
    get:
      tags: [Approvals]
      operationId: getApprovalMonitoring
      summary: The Monitoring tab — cards, ageing, waiting by level, overdue rows (FR-029, FR-030)
      description: Computed over the rows of the All open tab. monthStart / monthEnd as in getApprovalSummary (both or neither; default the current UTC month).
      parameters:
        - name: monthStart
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: monthEnd
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The monitoring figures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalMonitoring"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/approvals/escalations/run:
    post:
      tags: [Approvals]
      operationId: runApprovalEscalations
      summary: Send due reminders and escalations now (needs workflows.manage; stands in for the nightly job) (FR-026 – FR-028)
      description: Safe to call any number of times; each level gets at most one reminder and one escalation. Events are recorded as made by SP&A One.
      responses:
        "200":
          description: What was sent, and what could not be escalated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EscalationRunResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: mapp_session
      description: HttpOnly session cookie set by sign-in.
  parameters:
    # Feature 032 Purchase requests
    PurchaseRequestId:
      name: purchaseRequestId
      in: path
      required: true
      schema:
        type: string
      example: PR-1001
    RoutingId:
      name: routingId
      in: path
      required: true
      schema:
        type: string
      example: PRR-1001
    PurchaseRequestSearch:
      name: q
      in: query
      schema:
        type: string
        maxLength: 120
    PurchaseRequestStatusFilter:
      name: status
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: "#/components/schemas/PurchaseRequestStatus"
    PurchaseRequestTypeFilter:
      name: type
      in: query
      description: Option IDs of the attribute with role PR type; any of them matches.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    PurchaseRequestTypeNotCompleted:
      name: typeNotCompleted
      in: query
      description: Also match PRs without a PR type ("Not completed").
      schema:
        type: boolean
        default: false
    PurchaseRequestVendorFilter:
      name: vendor
      in: query
      description: Vendor texts, compared ignoring case.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    PurchaseRequestVendorNotCompleted:
      name: vendorNotCompleted
      in: query
      schema:
        type: boolean
        default: false
    PurchaseRequestOwnerFilter:
      name: owner
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    PurchaseRequestCreatedFrom:
      name: createdFrom
      in: query
      schema:
        type: string
        format: date
    PurchaseRequestCreatedTo:
      name: createdTo
      in: query
      schema:
        type: string
        format: date
    PurchaseRequestWaitingForGsap:
      name: waitingForGsap
      in: query
      description: Only approved, routed PRs that GSAP has not answered yet (FR-032).
      schema:
        type: boolean
        default: false
    PurchaseRequestSort:
      name: sort
      in: query
      description: Sort inside each vendor group; "-" sorts descending.
      schema:
        type: string
        enum: [name, -name, id, -id, status, -status, amount, -amount, created, -created]
        default: id
    PurchaseRequestPageNumber:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PurchaseRequestPageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        enum: [50, 100, 200]
        default: 50
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
      example: BIN-1001
    FolderId:
      name: folderId
      in: path
      required: true
      schema:
        type: string
      example: SF-1001
    ModelId:
      name: modelId
      in: path
      required: true
      schema:
        type: string
      example: MOD-1001
    ActivityTypeId:
      name: activityTypeId
      in: path
      required: true
      schema:
        type: string
      example: AT-1001
    AttributeId:
      name: attributeId
      in: path
      required: true
      schema:
        type: string
      example: SA-1001
    OptionId:
      name: optionId
      in: path
      required: true
      schema:
        type: string
      example: SO-1001
    CurrencyCode:
      name: code
      in: path
      required: true
      description: The ISO code, which is the currency's id.
      schema:
        type: string
      example: EUR
    BudgetId:
      name: budgetId
      in: path
      required: true
      schema:
        type: string
      example: FB-1001
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
      example: FBI-1001
    LevelPath:
      name: level
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AttributeLevel"
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
      example: U-1002
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
      example: T-1001
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
      example: P-1001
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
      example: C-1001
    InitiativeId:
      name: initiativeId
      in: path
      required: true
      schema:
        type: string
      example: I-1001
    Purpose:
      name: purpose
      in: query
      required: true
      description: What the destinations are for. Anything else answers validation_failed on purpose.
      schema:
        type: string
        enum:
          - move
          - copy
    ActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: string
      example: A-1001
    InitiativeIdPath:
      name: initiativeId
      in: path
      required: true
      schema:
        type: string
      example: I-1001
    LineItemId:
      name: lineItemId
      in: path
      required: true
      schema:
        type: string
      example: L-1001
    RestartApproval:
      name: restartApproval
      in: query
      required: false
      deprecated: true
      description: Ignored since feature 034 (D-322) - a line-item delete never sends the activity back for approval.
      schema:
        type: boolean
        default: false
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema:
        type: string
      example: WF-1001
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
      example: NT-1001
    HomeScope:
      name: scope
      in: query
      required: true
      description: myTeams covers plans with at least one of the person's teams; everything covers all plans.
      schema:
        $ref: "#/components/schemas/HomeScope"
    AllWorkYear:
      name: year
      in: query
      description: The plans' year. Default - the current year.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    AllWorkView:
      name: view
      in: query
      description: grid (default), calendar or budget (Budget & cost).
      schema:
        type: string
        enum:
          - grid
          - calendar
          - budget
          - breakdown
        default: grid
    AllWorkPlan:
      name: plan
      in: query
      description: Plan IDs (repeat the parameter for several).
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          example: P-1001
    AllWorkPlanStatus:
      name: planStatus
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - draft
            - published
    AllWorkContainerStatus:
      name: containerStatus
      in: query
      description: Campaign and initiative statuses. OR within Approval progress and within Timing; AND between the two.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - noActivities
            - inProgress
            - allApproved
            - notStarted
            - running
            - finished
    AllWorkActivityStatus:
      name: activityStatus
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - created
            - submitted
            - declined
            - approved
            - inProgress
            - complete
    AllWorkOwner:
      name: owner
      in: query
      description: Person IDs; tested on plans, campaigns, initiatives and activities.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          example: U-1003
    AllWorkTeam:
      name: team
      in: query
      description: Team IDs; tested on the plan's teams.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    AllWorkBusinessUnit:
      name: businessUnit
      in: query
      description: Option IDs of the plan-level Business unit attribute.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    AllWorkActivityType:
      name: activityType
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    AllWorkStrategic:
      name: strategic
      in: query
      description: Strategic / AOP plans.
      schema:
        type: string
        enum:
          - include
          - only
          - exclude
        default: include
    AllWorkShowLevels:
      name: showLevels
      in: query
      schema:
        type: string
        enum:
          - everything
          - completeBranches
          - campaignsWithoutInitiatives
          - initiativesWithoutActivities
        default: everything
    AllWorkSearch:
      name: search
      in: query
      description: >-
        Text searched in name, ID, external name and description at every level, ignoring letter case (at most 200
        characters).
      schema:
        type: string
    AllWorkColumn:
      name: column
      in: query
      description: Grid columns in display order (repeat the parameter). Name is always shown and is not a column.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          example: plannedCost
    AllWorkSort:
      name: sort
      in: query
      description: A column key and a direction, e.g. plannedCost:desc. Children are sorted within each parent.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]+:(asc|desc)$
    AllWorkPeriod:
      name: period
      in: query
      description: Budget & cost columns by month (default) or quarter.
      schema:
        type: string
        enum:
          - month
          - quarter
          - year
        default: month
    AllWorkRecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: string
      example: A-1001
    ViewId:
      name: viewId
      in: path
      required: true
      schema:
        type: string
      example: SV-1001
    BulkActionId:
      name: bulkActionId
      in: path
      required: true
      schema:
        type: string
      example: BLK-1001
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
      example: IMP-1001
    # Feature 014 Access control and global budgets (merged 2026-10-20, D-298)
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
      example: RL-1003
    GlobalBudgetId:
      name: globalBudgetId
      in: path
      required: true
      schema:
        type: string
      example: GB-1001
    AllocationId:
      name: allocationId
      in: path
      required: true
      schema:
        type: string
      example: BA-1001
    # Feature 015 Financial transactions (merged 2026-10-20, D-298)
    FinancialRecordId:
      name: recordId
      in: path
      required: true
      description: A plan, campaign, initiative, activity or line item readable ID.
      schema:
        type: string
        pattern: ^[PCIAL]-[0-9]+$
        example: A-1002
    FinancialTransactionId:
      name: transactionId
      in: path
      required: true
      schema:
        type: string
        pattern: ^FT-[0-9]+$
        example: FT-1003
    FinancialType:
      name: type
      in: query
      description: The tab. Default all.
      schema:
        type: string
        enum: [all, purchaseOrder, invoice, payment, accrual]
        default: all
    FinancialSearch:
      name: q
      in: query
      description: >-
        Text searched, ignoring letter case, in document number, PO number, vendor code and name, SWBS code,
        HX key, description, and the linked line item's and activity's name and ID (at most 200 characters).
      schema:
        type: string
        maxLength: 200
    FinancialYear:
      name: year
      in: query
      description: The linked plan's year; not-linked transactions by posting year. Default the current year.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    FinancialPlan:
      name: planId
      in: query
      schema:
        type: string
        pattern: ^P-[0-9]+$
    FinancialRecordFilter:
      name: recordId
      in: query
      description: Only transactions linked under this record (plan, campaign, initiative, activity or line item).
      schema:
        type: string
        pattern: ^[PCIAL]-[0-9]+$
    FinancialLinkFilter:
      name: link
      in: query
      description: The Not linked tab sends notLinked. Default all.
      schema:
        type: string
        enum: [all, linked, notLinked]
        default: all
    FinancialSort:
      name: sort
      in: query
      description: A column and a direction. Default postingDate:desc (ties by ID, newest first). amount sorts by the USD value.
      schema:
        type: string
        pattern: ^(postingDate|documentNumber|type|vendor|amount|linkedTo):(asc|desc)$
        default: postingDate:desc
    FinancialPageNumber:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    FinancialPageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        enum: [50, 100, 200]
        default: 50
    AllWorkFinance:
      name: finance
      in: query
      description: >-
        Financials filter (FR-024), tested on activities; values combine with OR. committedAbovePlanned holds when
        the activity or one of its line items is committed above its planned cost.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum: [hasPurchaseOrder, noPurchaseOrder, invoiced, committedAbovePlanned]
    # Feature 016 Planning and currency extensions (merged 2026-10-20, D-298)
    RateId:
      name: rateId
      in: path
      required: true
      schema:
        type: string
      example: XR-1001
    HelpKey:
      name: helpKey
      in: path
      required: true
      description: A key of the Field help catalogue (data-model §6).
      schema:
        type: string
        pattern: ^[a-zA-Z]+\.[a-zA-Z]+$
      example: plan.budget
    PlansYearFrom:
      name: yearFrom
      in: query
      description: First year of the range (inclusive). With yearTo; year is an alias for yearFrom = yearTo.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    PlansYearTo:
      name: yearTo
      in: query
      description: Last year of the range (inclusive); not before yearFrom.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    PlansType:
      name: type
      in: query
      description: Only plans of these types (repeat the parameter); every type when not sent.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/PlanType"
      style: form
      explode: true
    AllWorkYearFrom:
      name: yearFrom
      in: query
      description: First year of the range; default the current year. year is an alias for yearFrom = yearTo.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    AllWorkYearTo:
      name: yearTo
      in: query
      description: Last year of the range; default yearFrom; at most yearFrom + 4 ("Choose at most 5 years.").
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    AllWorkPlanType:
      name: planType
      in: query
      description: Plans of these types (tested on plans).
      schema:
        type: array
        items:
          $ref: "#/components/schemas/PlanType"
      style: form
      explode: true
    AllWorkPlanCurrency:
      name: planCurrency
      in: query
      description: Plans planned in these currencies (tested on plans).
      schema:
        type: array
        items:
          type: string
          pattern: ^[A-Z]{3}$
      style: form
      explode: true
    AllWorkAttr:
      name: attr
      in: query
      description: |
        A Shell-attribute filter, repeatable: <attributeId>:<value>,<value>… where a value is an option id,
        yes, no, or none (Not filled in). Tested on the attribute's level (016 FR-039).
      schema:
        type: array
        items:
          type: string
          pattern: "^[A-Z]+-[0-9]+:[A-Za-z0-9,-]+$"
      style: form
      explode: true
      example: ["SA-1022:SO-1301,none"]
    AllWorkComparePhased:
      name: comparePhased
      in: query
      description: Budget & cost only - add phasedBudget and overPeriods to plan, campaign and initiative rows.
      schema:
        type: boolean
        default: false
    AllWorkBy:
      name: by
      in: query
      description: >-
        The grouping - attr:<attributeId>, plan, planType, planCurrency, year, team, businessUnit, activityType or
        owner. Needed by GET /api/v1/all-work/breakdown and by the Breakdown export (view=breakdown): missing there, it
        answers 400 validation_failed on by. Optional in the contract so the other exports need not send it (D-298).
      schema:
        type: string
      example: attr:SA-1013
    AllWorkThenBy:
      name: thenBy
      in: query
      description: An optional second grouping, different from by.
      schema:
        type: string
    AllWorkAmountsIn:
      name: amountsIn
      in: query
      description: display (default) or plan (one plan filtered - its plan currency).
      schema:
        type: string
        enum:
          - display
          - plan
        default: display
    # Feature 017 Approval rules (merged 2026-10-20, D-298)
    DelegationId:
      name: delegationId
      in: path
      required: true
      schema:
        type: string
      example: DLG-1001
  responses:
    BadRequest:
      description: >-
        The request is not valid (validation_failed lists every field problem; bad_request when the body cannot be
        read).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not signed in (sign_in_required), session expired (session_expired) or sign-in failed (incorrect_credentials).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: >-
        The record or path does not exist, or the record is outside the person's access, which answers exactly like a
        missing record (also the demo sign-in paths when demo sign-in is disabled).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >-
        The record changed meanwhile (version_conflict), a name is taken (name_taken), the record is in use (in_use), a
        restore cannot happen (cannot_restore, restore_parent_first, parent_deleted_permanently), the action is not
        allowed for this person (not_allowed) or needs fields filled first (not_ready, with missing), or an undo or
        restore is no longer possible (undo_expired, already_resolved).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Any other failure (for example internal_error).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    # Feature 014 Access control and global budgets (merged 2026-10-20, D-298)
    Forbidden:
      description: >-
        The signed-in person's roles do not allow this (forbidden). The message says so in plain language and names
        nothing of a record they cannot see. Nothing was changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    # Feature 037 Overspend control
    OverspendMode:
      type: string
      description: What happens when planned cost goes over a budget — warn (save and show it) or refuse the save.
      enum: [warn, refuse]
    OverspendControl:
      type: object
      additionalProperties: false
      required: [mode, canChange]
      properties:
        mode:
          $ref: "#/components/schemas/OverspendMode"
        canChange:
          $ref: "#/components/schemas/ActionAvailability"
    OverspendLimit:
      type: object
      additionalProperties: false
      required: [budget, leftToPlan]
      properties:
        budget:
          $ref: "#/components/schemas/RecordRef"
        leftToPlan:
          $ref: "#/components/schemas/Money"
    OverspendConfiguration:
      type: object
      additionalProperties: false
      required: [defaultMode, version, updatedAt, updatedBy, canChange]
      properties:
        defaultMode:
          $ref: "#/components/schemas/OverspendMode"
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: "#/components/schemas/ActorRef"
        canChange:
          $ref: "#/components/schemas/ActionAvailability"
    OverspendConfigurationInput:
      type: object
      additionalProperties: false
      required: [version, defaultMode]
      properties:
        version:
          type: integer
        defaultMode:
          type: string
    # Features 032 and 033 Purchase requests and the simulated GSAP purchase order
    PurchaseRequestStatus:
      type: string
      enum: [created, submitted, inReview, declined, approved, closed]
    PurchaseRequestRoundKind:
      type: string
      description: The approval engine's subject kind of a round (031).
      enum: [purchaseRequest, modifiedPurchaseRequest]
    LinesOnApprovedPurchaseRequests:
      type: string
      enum: [notAllowed, withModificationApproval, withoutApproval]
    PurchaseRequestRoutingType:
      type: string
      enum: [original, modification, resend, close]
    GsapSource:
      type: string
      description: Who filled the GSAP fields; empty until GSAP answered. Screens say "Simulated GSAP" or "GSAP".
      enum: ["", simulatedGsap, gsap]
    PurchaseRequestConfiguration:
      type: object
      additionalProperties: false
      required: [purchaseSupport, linesOnApprovedPurchaseRequests, version, updatedAt, updatedBy, canChange]
      properties:
        purchaseSupport:
          type: boolean
        linesOnApprovedPurchaseRequests:
          $ref: "#/components/schemas/LinesOnApprovedPurchaseRequests"
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: "#/components/schemas/ActorRef"
        canChange:
          $ref: "#/components/schemas/ActionAvailability"
    PurchaseRequestConfigurationInput:
      type: object
      additionalProperties: false
      required: [version, purchaseSupport, linesOnApprovedPurchaseRequests]
      properties:
        version:
          type: integer
        purchaseSupport:
          type: boolean
        linesOnApprovedPurchaseRequests:
          $ref: "#/components/schemas/LinesOnApprovedPurchaseRequests"
    PurchaseRequestLineItemRef:
      type: object
      additionalProperties: false
      description: The line item a PR line draws on, as it is now.
      required: [id, name, activityId, activityName, currency, plannedCost, swbsCode, swbsStatus, companyCode, costCentre, glCode]
      properties:
        id:
          type: string
          example: L-1006
        name:
          type: string
          example: Stand build
        activityId:
          type: string
        activityName:
          type: string
        currency:
          type: string
        plannedCost:
          $ref: "#/components/schemas/Money"
        swbsCode:
          type: string
          description: Empty until the line item received its code (030).
        swbsStatus:
          $ref: "#/components/schemas/SwbsStatus"
        companyCode:
          type: string
        costCentre:
          type: string
        glCode:
          type: string
    PurchaseRequestLine:
      type: object
      additionalProperties: false
      required: [id, position, lineItem, hxKey, currency, amount, deliveryDate, overallLimit, description, attributes, sentOn, poNumber, poLine, poLineStatus, poDate, poValue, invoiced, changed, missing, access, version, gsapPending]
      properties:
        id:
          type: string
          example: PRL-1001
        position:
          type: integer
          minimum: 1
        lineItem:
          $ref: "#/components/schemas/PurchaseRequestLineItemRef"
        hxKey:
          type: string
          example: HX1006
        currency:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        deliveryDate:
          type: string
          format: date
        overallLimit:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        description:
          type: string
        attributes:
          $ref: "#/components/schemas/AttributeValues"
        sentOn:
          type: [string, "null"]
          format: date
        poNumber:
          type: string
        poLine:
          type: string
        poLineStatus:
          type: string
        poDate:
          type: [string, "null"]
          format: date
        poValue:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        invoiced:
          description: Invoices minus credit notes on the line's PO line, in the line's currency (0.00 without a PO).
          $ref: "#/components/schemas/Money"
        changed:
          type: boolean
          description: True while a change is In review and this line differs from the approved version or is new.
        missing:
          type: array
          description: The line's empty needed-to-submit fields.
          items:
            $ref: "#/components/schemas/MissingField"
        access:
          $ref: "#/components/schemas/PurchaseRequestLineAccess"
        version:
          type: integer
          minimum: 1
        gsapPending:
          type: boolean
          description: >-
            The line has no PO line yet, or its amount or currency differs from its PO value: the next run of
            the simulated GSAP sends it (033 FR-003, FR-007).
    PurchaseRequestLineAccess:
      type: object
      additionalProperties: false
      required: [remove]
      properties:
        remove:
          $ref: "#/components/schemas/ActionAvailability"
    PurchaseRequestVersion:
      type: object
      additionalProperties: false
      description: The PR's values at its last approval, shown as "Approved version" while a change is In review.
      required: [name, description, owner, moaApprover, attributes, amountDisplay, lines, approvedAt]
      properties:
        name:
          type: string
        description:
          type: string
        owner:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        moaApprover:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        attributes:
          $ref: "#/components/schemas/AttributeValues"
        amountDisplay:
          $ref: "#/components/schemas/Money"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseRequestVersionLine"
        approvedAt:
          type: string
          format: date-time
    PurchaseRequestVersionLine:
      type: object
      additionalProperties: false
      required: [id, lineItemId, hxKey, amount, deliveryDate, overallLimit, description]
      properties:
        id:
          type: string
        lineItemId:
          type: string
        hxKey:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        deliveryDate:
          type: string
          format: date
        overallLimit:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        description:
          type: string
    PurchaseRequestRouting:
      type: object
      additionalProperties: false
      required: [id, type, routedAt, routedBy, recipients, lineCount]
      properties:
        id:
          type: string
          example: PRR-1001
        type:
          $ref: "#/components/schemas/PurchaseRequestRoutingType"
        routedAt:
          type: string
          format: date-time
        routedBy:
          $ref: "#/components/schemas/ActorRef"
        recipients:
          type: array
          minItems: 1
          items:
            type: string
          example: [DE_LUBES]
        lineCount:
          type: integer
          minimum: 1
    PurchaseRequestProblem:
      type: object
      additionalProperties: false
      description: One thing that stops a submission (FR-021).
      required: [field, group, recordId, message]
      properties:
        field:
          type: string
          description: The form field to go to, e.g. moaApproverId, attributes.SA-1101, lines[0].overallLimit; empty for a gate on another record.
        group:
          type: string
          enum: [purchaseRequest, line, activity, lineItem]
        recordId:
          type: string
          description: The PR, PR line, activity or line item concerned.
        message:
          type: string
          example: Activity 'Trade magazine ads' must be approved before this purchase request can be submitted.
    PurchaseRequestReadiness:
      type: object
      additionalProperties: false
      required: [ready, problems]
      properties:
        ready:
          type: boolean
        problems:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseRequestProblem"
    PurchaseRequestAccess:
      type: object
      additionalProperties: false
      description: What the signed-in person may do with this PR now, and why not (FR-056).
      required: [edit, delete, submit, resubmit, submitChanges, recall, close, resend, addLine, gsapOrder]
      properties:
        edit:
          $ref: "#/components/schemas/ActionAvailability"
        delete:
          $ref: "#/components/schemas/ActionAvailability"
        submit:
          $ref: "#/components/schemas/ActionAvailability"
        resubmit:
          $ref: "#/components/schemas/ActionAvailability"
        submitChanges:
          $ref: "#/components/schemas/ActionAvailability"
        recall:
          $ref: "#/components/schemas/ActionAvailability"
        close:
          $ref: "#/components/schemas/ActionAvailability"
        resend:
          $ref: "#/components/schemas/ActionAvailability"
        addLine:
          $ref: "#/components/schemas/ActionAvailability"
        gsapOrder:
          description: >-
            Create GSAP PR and PO (simulated): hidden (available false, reason empty) without finance.import;
            otherwise available, or the reason it is not (033 FR-001).
          $ref: "#/components/schemas/ActionAvailability"
    PurchaseRequest:
      type: object
      additionalProperties: false
      required: [id, name, description, owner, moaApprover, approvalWorkflow, modificationWorkflow, status, changePending, plan, path, companyCode, costCentres, hxKeys, attributes, vendor, amountDisplay, invoicedDisplay, gsapPrNumber, gsapPrDate, gsapSource, waitingForGsap, lines, approvedVersion, routings, readiness, missing, notice, access, version, createdAt, createdBy, updatedAt, updatedBy]
      properties:
        id:
          type: string
          example: PR-1001
        name:
          type: string
        description:
          type: string
        owner:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        moaApprover:
          description: The MoA approver (needed to submit); null until chosen.
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        approvalWorkflow:
          oneOf:
            - $ref: "#/components/schemas/WorkflowRef"
            - type: "null"
        modificationWorkflow:
          oneOf:
            - $ref: "#/components/schemas/WorkflowRef"
            - type: "null"
        status:
          $ref: "#/components/schemas/PurchaseRequestStatus"
        changePending:
          type: boolean
          description: A change of the Approved PR is In review.
        plan:
          $ref: "#/components/schemas/RecordRef"
        path:
          type: array
          description: Plan, campaign, initiative and activity of the first line.
          items:
            $ref: "#/components/schemas/RecordRef"
        companyCode:
          type: string
          description: The company code of the lines' activities; empty when none is filled.
        costCentres:
          type: array
          items:
            type: string
        hxKeys:
          type: array
          items:
            type: string
        attributes:
          $ref: "#/components/schemas/AttributeValues"
        vendor:
          type: string
        amountDisplay:
          $ref: "#/components/schemas/Money"
        invoicedDisplay:
          $ref: "#/components/schemas/Money"
        gsapPrNumber:
          type: string
          description: GSAP's PR number, read-only, "Filled by GSAP"; empty until GSAP answers (033).
        gsapPrDate:
          type: [string, "null"]
          format: date
        gsapSource:
          $ref: "#/components/schemas/GsapSource"
        waitingForGsap:
          type: boolean
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PurchaseRequestLine"
        approvedVersion:
          oneOf:
            - $ref: "#/components/schemas/PurchaseRequestVersion"
            - type: "null"
        routings:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/PurchaseRequestRouting"
        readiness:
          $ref: "#/components/schemas/PurchaseRequestReadiness"
        missing:
          type: array
          description: The header's empty needed-to-submit fields (completeness chip).
          items:
            $ref: "#/components/schemas/MissingField"
        notice:
          type: string
          description: |
            One sentence the page shows above the details, or empty: "Awaiting approval — saving changes will
            restart approval.", "Closed purchase requests cannot be changed.", "Purchase requests are switched
            off for your organisation."
        access:
          $ref: "#/components/schemas/PurchaseRequestAccess"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: "#/components/schemas/ActorRef"
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: "#/components/schemas/ActorRef"
    PurchaseRequestInput:
      type: object
      additionalProperties: false
      required: [name, ownerId, approvalWorkflowId, modificationWorkflowId, attributes, lines, then]
      properties:
        version:
          type: integer
          description: Required by PUT (the version the person started from); ignored by POST.
        name:
          type: string
        description:
          type: string
        ownerId:
          type: string
        moaApproverId:
          type: [string, "null"]
        approvalWorkflowId:
          type: string
        modificationWorkflowId:
          type: string
        attributes:
          $ref: "#/components/schemas/AttributeValues"
        lines:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/PurchaseRequestLineInput"
        then:
          type: string
          enum: [save, resubmit, submitChanges]
        comment:
          type: string
          description: The submission comment of resubmit and submitChanges; at most 2,000 characters.
    PurchaseRequestLineInput:
      type: object
      additionalProperties: false
      required: [lineItemId, currency, amount, deliveryDate]
      properties:
        id:
          type: string
          description: The stored line this row changes; absent for a new line.
        lineItemId:
          type: string
        currency:
          type: string
        amount:
          type: string
          description: Decimal string, at most two decimals.
          example: "9200.00"
        deliveryDate:
          type: string
          format: date
        overallLimit:
          type: [string, "null"]
          description: Decimal string; null when empty.
        description:
          type: string
        attributes:
          $ref: "#/components/schemas/AttributeValues"
    PurchaseRequestDefaults:
      type: object
      additionalProperties: false
      required: [name, owner, plan, companyCode, line]
      properties:
        name:
          type: string
          example: PR for Stand build
        owner:
          $ref: "#/components/schemas/PersonRef"
        plan:
          $ref: "#/components/schemas/RecordRef"
        companyCode:
          type: string
        line:
          type: object
          additionalProperties: false
          required: [lineItem, hxKey, currency, amount, overallLimit]
          properties:
            lineItem:
              $ref: "#/components/schemas/PurchaseRequestLineItemRef"
            hxKey:
              type: string
            currency:
              type: string
            amount:
              $ref: "#/components/schemas/Money"
            overallLimit:
              $ref: "#/components/schemas/Money"
    PurchaseRequestLineItemOption:
      type: object
      additionalProperties: false
      required: [lineItem, plan, path, hxKey, availableToRequest, available, reason]
      properties:
        lineItem:
          $ref: "#/components/schemas/PurchaseRequestLineItemRef"
        plan:
          $ref: "#/components/schemas/RecordRef"
        path:
          type: array
          items:
            $ref: "#/components/schemas/RecordRef"
        hxKey:
          type: string
        availableToRequest:
          $ref: "#/components/schemas/Money"
        available:
          type: boolean
        reason:
          type: string
          example: One purchase request cannot charge two company codes (GB01 and NL02).
    PurchaseRequestLineItemOptionPage:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/PurchaseRequestLineItemOption"
        total:
          type: integer
          minimum: 0
    PurchaseRequestVendorGroup:
      type: object
      additionalProperties: false
      required: [vendor, label, purchaseRequests, amountDisplay, invoicedDisplay]
      properties:
        vendor:
          type: string
          description: The vendor text; empty for "Not completed".
        label:
          type: string
          example: Brightside Media BV
        purchaseRequests:
          type: integer
          minimum: 0
        amountDisplay:
          $ref: "#/components/schemas/Money"
        invoicedDisplay:
          $ref: "#/components/schemas/Money"
    PurchaseRequestRowLine:
      type: object
      additionalProperties: false
      required: [id, lineItem, lineItemOwner, hxKey, amount, deliveryDate, sentOn, poNumber, poLine, poLineStatus, invoiced]
      properties:
        id:
          type: string
        lineItem:
          $ref: "#/components/schemas/PurchaseRequestLineItemRef"
        lineItemOwner:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        hxKey:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        deliveryDate:
          type: string
          format: date
        sentOn:
          type: [string, "null"]
          format: date
        poNumber:
          type: string
        poLine:
          type: string
        poLineStatus:
          type: string
        invoiced:
          $ref: "#/components/schemas/Money"
    PurchaseRequestRow:
      type: object
      additionalProperties: false
      required: [id, name, vendor, status, changePending, amountDisplay, invoicedDisplay, owner, createdAt, approvalWorkflow, gsapPrNumber, waitingForGsap, plan, lines]
      properties:
        id:
          type: string
        name:
          type: string
        vendor:
          type: string
        status:
          $ref: "#/components/schemas/PurchaseRequestStatus"
        changePending:
          type: boolean
        amountDisplay:
          $ref: "#/components/schemas/Money"
        invoicedDisplay:
          $ref: "#/components/schemas/Money"
        owner:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        approvalWorkflow:
          oneOf:
            - $ref: "#/components/schemas/WorkflowRef"
            - type: "null"
        gsapPrNumber:
          type: string
        waitingForGsap:
          type: boolean
        plan:
          $ref: "#/components/schemas/RecordRef"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseRequestRowLine"
    PurchaseRequestListPage:
      type: object
      additionalProperties: false
      required: [items, total, page, pageSize, vendors, purchaseSupport]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseRequestRow"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
        vendors:
          type: array
          description: The vendors of this page's rows, in the page's order.
          items:
            $ref: "#/components/schemas/PurchaseRequestVendorGroup"
        purchaseSupport:
          type: boolean
    PurchaseRequestCloseLine:
      type: object
      additionalProperties: false
      required: [lineId, lineItemId, hxKey, amount, invoiced, closedAmount, released]
      properties:
        lineId:
          type: string
        lineItemId:
          type: string
        hxKey:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        invoiced:
          $ref: "#/components/schemas/Money"
        closedAmount:
          $ref: "#/components/schemas/Money"
        released:
          $ref: "#/components/schemas/Money"
    PurchaseRequestClosePreview:
      type: object
      additionalProperties: false
      required: [purchaseRequestId, version, available, reason, lines, releasedDisplay]
      properties:
        purchaseRequestId:
          type: string
        version:
          type: integer
        available:
          type: boolean
        reason:
          type: string
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseRequestCloseLine"
        releasedDisplay:
          $ref: "#/components/schemas/Money"
    PurchaseRequestCloseRequest:
      type: object
