      required:
        - id
        - name
        - initials
        - jobTitle
        - active
      properties:
        id:
          type: string
          example: U-1002
        name:
          type: string
          example: Priya Raman
        initials:
          type: string
          example: PR
        jobTitle:
          type: string
          description: Empty when the person has none.
          example: Marketer
        active:
          type: boolean
    TeamRef:
      type: object
      additionalProperties: false
      description: A team as every other record shows it (plan teams, My teams). When active is false, screens add "(inactive)".
      required:
        - id
        - name
        - colour
        - active
      properties:
        id:
          type: string
          example: T-1001
        name:
          type: string
          example: Lubricants Europe
        colour:
          $ref: "#/components/schemas/TeamColour"
        active:
          type: boolean
    TeamColour:
      type: string
      description: The team's colour from the team palette (decision D-025).
      enum:
        - blue
        - violet
        - teal
        - magenta
        - orange
        - green
        - slate
        - gold
    Person:
      type: object
