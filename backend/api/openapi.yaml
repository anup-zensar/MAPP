        deletedAt:
          type: string
          format: date-time
        deletedBy:
          $ref: "#/components/schemas/ActorRef"
        contents:
          type: array
          description: What was under it, counted by kind.
          items:
            $ref: "#/components/schemas/ContentCount"
    RecycleBinPage:
      type: object
      additionalProperties: false
      required:
