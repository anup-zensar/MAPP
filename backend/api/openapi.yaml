    post:
      tags:
        - Plans
      operationId: copyPlan
      summary: Copy a plan, with or without everything in it, into the same or the next year
      description: |
        The copy is a Draft plan with a new ID, made completely or not at all. A next-year copy moves every
        copied date one year later and clears the default finance budget (said in notes).
