      required:
        - name
        - year
        - modelId
        - teamIds
        - ownerId
        - aop
        - description
        - budget
        - defaultFinanceBudgetId
        - defaultSpread
        - bcpir
        - goalStage
        - goalAmount
        - attributes
      properties:
        name:
          type: string
        year:
          type:
            - integer
            - "null"
        modelId:
          type:
            - string
            - "null"
        teamIds:
          type: array
          items:
            type: string
        ownerId:
          type:
            - string
            - "null"
        aop:
          type: boolean
        description:
          type: string
        budget:
          description: In USD; null for no budget.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        defaultFinanceBudgetId:
          type:
            - string
            - "null"
        defaultSpread:
          type: string
          description: One of SpreadMethod; checked by the server.
        bcpir:
          type: boolean
        goalStage:
          type: string
          description: One of GoalStage; checked by the server.
        goalAmount:
          type:
            - string
            - "null"
        attributes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AttributeValue"
    PlanUpdate:
      type: object
      additionalProperties: false
      description: The whole plan form (the year is not part of it) and the version the person started from.
      required:
        - version
        - name
        - modelId
        - teamIds
        - ownerId
        - aop
        - description
        - budget
        - defaultFinanceBudgetId
        - defaultSpread
        - bcpir
        - goalStage
        - goalAmount
        - attributes
      properties:
        version:
          type: integer
          description: The version the person started editing from.
        name:
          type: string
        modelId:
          type:
            - string
            - "null"
        teamIds:
          type: array
          items:
            type: string
        ownerId:
          type:
            - string
            - "null"
        aop:
          type: boolean
        description:
          type: string
        budget:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        defaultFinanceBudgetId:
          type:
            - string
            - "null"
        defaultSpread:
          type: string
        bcpir:
          type: boolean
        goalStage:
          type: string
        goalAmount:
          type:
            - string
            - "null"
        attributes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AttributeValue"
    UnpublishRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          description: Why the plan is unpublished, 1 to 500 characters after trimming.
    NextYearOption:
      type: object
      additionalProperties: false
      required:
        - year
        - available
        - reason
      properties:
        year:
          type: integer
        available:
          type: boolean
        reason:
          type: string
          description: Why the next year can't be chosen; empty when it can.
    PlanCopyOptions:
      type: object
      additionalProperties: false
      required:
        - name
        - sameYear
        - nextYear
        - contents
      properties:
        name:
          type: string
          description: The suggested name, "<name> (copy)" or the next free "(copy n)", at most 120 characters.
        sameYear:
          type: integer
        nextYear:
          $ref: "#/components/schemas/NextYearOption"
        contents:
          $ref: "#/components/schemas/PlanContents"
    PlanCopyRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - year
        - includeContents
      properties:
        name:
          type: string
        year:
          type: integer
          description: The source plan's year or the next one.
        includeContents:
          type: boolean
          description: Also copy campaigns, initiatives, activities and line items.
    PlanCopyResult:
      type: object
      additionalProperties: false
      required:
        - plan
        - notes
      properties:
        plan:
          $ref: "#/components/schemas/Plan"
        notes:
          type: array
          description: What the copy changed on purpose, for example a cleared default finance budget.
          items:
            type: string
    PlanChangeEffectsRequest:
      type: object
      additionalProperties: false
      required:
        - modelId
        - attributes
      properties:
        modelId:
          type:
            - string
            - "null"
        attributes:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AttributeValue"
    AttributeGroupChange:
      type: object
      additionalProperties: false
      description: Shell attributes tied to one business-unit option that a change would hide or show.
      required:
        - unit
        - levels
        - attributes
      properties:
        unit:
          type: string
          example: Lubricants
        levels:
          type: array
          description: Where those attributes are, top-down.
          items:
            type: string
            enum:
              - plan
              - campaign
              - initiative
              - activity
              - lineItem
        attributes:
          type: array
          description: Their labels, in display order.
          items:
            type: string
    PlanChangeEffects:
      type: object
      additionalProperties: false
      required:
        - modelChanged
        - disallowedActivities
        - hiddenGroups
        - shownGroups
      properties:
        modelChanged:
          type: boolean
        disallowedActivities:
          type: array
          description: Activities whose type the new model does not allow; they keep it until changed.
          items:
            $ref: "#/components/schemas/RecordRef"
        hiddenGroups:
          type: array
          description: Groups hidden by the new business unit (values kept).
          items:
            $ref: "#/components/schemas/AttributeGroupChange"
        shownGroups:
          type: array
          items:
            $ref: "#/components/schemas/AttributeGroupChange"
    PlanRef:
      type: object
      additionalProperties: false
      description: The plan a campaign or initiative belongs to, for the breadcrumb and the R4 warning.
      required:
        - id
        - name
        - year
      properties:
        id:
          type: string
          example: P-1001
        name:
          type: string
          example: FY2026 Lubricants Europe
        year:
          type: integer
          example: 2026
    CampaignRef:
      type: object
      additionalProperties: false
      description: The campaign an initiative belongs to, with its dates (the initiative's allowed range, R3).
      required:
        - id
        - name
        - startDate
        - endDate
      properties:
        id:
          type: string
          example: C-1001
        name:
          type: string
          example: Helix launch
        startDate:
          type:
            - string
            - "null"
          format: date
        endDate:
          type:
            - string
            - "null"
          format: date
    BudgetAndCost:
      type: object
      additionalProperties: false
      description: Budget flowing down and cost rolling up for one campaign or initiative (domain model §4.1–4.2). All USD.
      required:
        - allocatedToChildren
        - remainingForChildren
        - overAllocatedBy
        - plannedCost
        - budgetUsedPercent
        - overBudget
        - leftToPlan
      properties:
        allocatedToChildren:
          description: Sum of the children's budgets (0.00 when none; always 0.00 for an initiative).
          $ref: "#/components/schemas/Money"
        remainingForChildren:
          description: Budget minus allocatedToChildren; null when the record has no budget. May be negative.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        overAllocatedBy:
          description: The positive amount by which remainingForChildren is below zero; null otherwise.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        plannedCost:
          description: Sum of the planned costs below; null when nothing below has a planned cost.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        budgetUsedPercent:
          type:
            - integer
            - "null"
          minimum: 0
          description: >-
            plannedCost × 100 ÷ budget rounded half up; null without a budget, with a budget of 0.00 or without a
            planned cost.
        overBudget:
          type: boolean
          description: plannedCost is greater than the budget (exact comparison).
        leftToPlan:
          description: Budget minus planned cost (0.00 when none); null without a budget. Negative when over budget.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
    ApprovalSummary:
      type: object
      additionalProperties: false
      description: >-
        Approval progress derived from the activities below (domain model §2.2) with its counts; Approved, In progress
        and Complete count as approved.
      required:
        - state
        - approved
        - total
      properties:
        state:
          $ref: "#/components/schemas/ApprovalProgress"
        approved:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    RecordCompleteness:
      type: object
      additionalProperties: false
