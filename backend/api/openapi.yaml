        - changedSinceImport
        - addedSinceImport
        - alreadyDeleted
      properties:
        activities:
          type: integer
        campaigns:
          type: integer
        initiatives:
          type: integer
        changedSinceImport:
          type: integer
        addedSinceImport:
          type: integer
        alreadyDeleted:
          type: integer
    ImportSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - planId
        - fileName
        - status
        - importedAt
        - importedBy
        - rowsRead
        - activitiesImported
        - campaignsCreated
        - initiativesCreated
        - rowsLeftOut
        - rowsFailed
        - undoneAt
        - undoneBy
      properties:
        id:
          type: string
          example: IMP-1001
        planId:
          type: string
        fileName:
          type: string
        status:
          type: string
          enum:
            - imported
            - undone
        importedAt:
          type: string
          format: date-time
        importedBy:
          $ref: "#/components/schemas/ActorRef"
        rowsRead:
          type: integer
        activitiesImported:
          type: integer
        campaignsCreated:
          type: integer
        initiativesCreated:
          type: integer
        rowsLeftOut:
          type: integer
        rowsFailed:
          type: integer
        undoneAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        undoneBy:
          oneOf:
            - $ref: "#/components/schemas/ActorRef"
            - type: "null"
    ImportDetail:
      type: object
      additionalProperties: false
      required:
        - import
        - problems
        - activities
        - campaigns
        - initiatives
        - undo
      properties:
        import:
          $ref: "#/components/schemas/ImportSummary"
        problems:
          type: array
          description: Rows left out and rows that failed, with their reasons.
          items:
            $ref: "#/components/schemas/ImportProblem"
        activities:
          type: array
          items:
            $ref: "#/components/schemas/ImportRecordRef"
        campaigns:
          type: array
          items:
            $ref: "#/components/schemas/ImportRecordRef"
        initiatives:
          type: array
          items:
            $ref: "#/components/schemas/ImportRecordRef"
        undo:
          description: What Undo import would do; null once undone.
          oneOf:
            - $ref: "#/components/schemas/ImportUndoPreview"
            - type: "null"
    PlanImportPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - canImport
        - cannotImportReason
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ImportSummary"
        total:
          type: integer
        canImport:
          type: boolean
        cannotImportReason:
          oneOf:
            - type: string
            - type: "null"
          example: Add at least one campaign and one initiative to this plan before importing activities
