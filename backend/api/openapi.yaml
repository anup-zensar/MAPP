        endDate:
          type:
            - string
            - "null"
          format: date
        suggestedName:
          type:
            - string
            - "null"
          description: For copies, the first free name "<name> (copy)", "(copy 2)", … in this destination; null for moves.
        remainingAfter:
          description: >-
            The destination's remaining budget for its children once this record's budget is added there, in the reader's
