            - $ref: "#/components/schemas/ActorRef"
            - type: "null"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: "#/components/schemas/ActorRef"
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: "#/components/schemas/ActorRef"
