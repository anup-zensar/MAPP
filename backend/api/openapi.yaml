      tags:
        - All work
      operationId: listSavedViews
      summary: The signed-in person's saved views, sorted by name ignoring letter case
      responses:
        "200":
          description: Only the signed-in person's views.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedViewPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - All work
      operationId: createSavedView
      summary: Save the current All work state under a name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedViewCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/saved-views/{viewId}:
    patch:
      tags:
        - All work
      operationId: updateSavedView
      summary: Rename a saved view, replace its state, or set or remove it as the default
      parameters:
        - $ref: "#/components/parameters/ViewId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedViewUpdate"
      responses:
        "200":
          description: The view after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - All work
      operationId: deleteSavedView
      summary: Delete a saved view (not to the recycle bin; the answer lets the web app offer Undo)
      parameters:
        - $ref: "#/components/parameters/ViewId"
      responses:
        "200":
          description: The deleted view, so that Undo can save it again.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/activity-log/summary:
    get:
      tags:
        - History
      operationId: getActivityLogSummary
      summary: Summary cards and filter choices of the activity log (whole log, ignoring filters)
      parameters:
        - name: todayStart
          in: query
          required: true
          description: Midnight today in the person's time zone, as a UTC moment.
          schema:
            type: string
            format: date-time
        - name: weekStart
          in: query
          required: true
          description: Midnight of this week's Monday in the person's time zone, as a UTC moment. Not after todayStart.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: The counts and the filter choices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityLogSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/recycle-bin/empty:
    post:
      tags:
        - History
      operationId: emptyRecycleBin
      summary: Delete permanently the listed recycle-bin entries (Empty recycle bin)
      description: |
        Purges every listed entry that is still in the recycle bin; entries already restored or deleted
        by someone else, and entries not listed, are left alone. Writes one activity-log entry
        "emptied the recycle bin" with the list when at least one entry was purged (FR-029, FR-030).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyRecycleBinRequest"
      responses:
        "200":
          description: How many entries were deleted permanently (0 when none was left).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyRecycleBinResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/recycle-bin/{entryId}:
    delete:
      tags:
        - History
      operationId: deleteRecycleBinEntryPermanently
      summary: Delete a recycle-bin entry permanently (it can't be undone)
      description: >-
        The records of the entry are removed for good; their IDs are never reused and the activity-log entries about
        them are kept (FR-030).
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: Deleted permanently.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurgeResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/recycle-bin/{entryId}/restore-preview:
    get:
      tags:
        - History
      operationId: previewRestore
      summary: What a restore from the recycle bin would do, without doing it
      description: |
        A dry run of the restore (parents still in the recycle bin first): where the item returns, what
        comes with it and every status and name change. Nothing is saved. For an entry whose parent was
        deleted permanently the lists are empty (the restore is not possible).
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestorePreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/bulk-actions/fields:
    get:
      tags:
        - Bulk actions
      operationId: listBulkFields
      summary: The fields Change field offers for one level, with their choices
      parameters:
        - name: level
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/BulkLevel"
      responses:
        "200":
          description: The offered fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkFieldList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/bulk-actions/targets:
    post:
      tags:
        - Bulk actions
      operationId: listBulkTargets
      summary: Where the selected records may be copied or moved (searchable, with the full path)
      description: POST because the selection (up to 1,000 IDs) is sent in the body; nothing changes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkTargetQuery"
      responses:
        "200":
          description: The first 100 allowed targets, sorted by path, and how many there are.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkTargetPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/bulk-actions/preview:
    post:
      tags:
        - Bulk actions
      operationId: previewBulkAction
      summary: What a bulk action would do - counts, re-approvals, effects and every skip reason - without saving
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkActionRequest"
      responses:
        "200":
          description: The preview (preview true, id null).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/bulk-actions:
    post:
      tags:
        - Bulk actions
      operationId: runBulkAction
      summary: Run a bulk action on the selected records
      description: >-
        Each record is changed, skipped (a rule prevents it) or failed (it no longer exists). Every change is in the
        activity log with the action's note.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkActionRequest"
      responses:
        "201":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkActionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/bulk-actions/{bulkActionId}/undo:
    post:
      tags:
        - Bulk actions
      operationId: undoBulkDelete
      summary: Undo a bulk delete - every deleted record comes back in one step (within 2 minutes)
      parameters:
        - $ref: "#/components/parameters/BulkActionId"
      responses:
        "200":
          description: Everything restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUndoResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/plans/{planId}/imports:
    get:
      tags:
        - Imports
      operationId: listPlanImports
      summary: The plan's imports, newest first, and whether it can take an import now
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: The imports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanImportPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Imports
      operationId: importActivities
      summary: Import the confirmed rows of a file as Created activities
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRun"
      responses:
        "201":
          description: Imported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/plans/{planId}/imports/check:
    post:
      tags:
        - Imports
      operationId: checkImportFile
      summary: Check a filled template - every problem of every row at once; nothing is created
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportUpload"
      responses:
        "200":
          description: The check.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportCheck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/plans/{planId}/import-template:
    get:
      tags:
        - Imports
      operationId: getImportTemplate
      summary: The import template made for this plan (.xlsx)
      description: Refused with validation_failed until the plan has a campaign and an initiative.
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: The template. Its name is in Content-Disposition (NorthStar import template – <plan>.xlsx).
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/imports/{importId}:
    get:
      tags:
        - Imports
      operationId: getImport
      summary: One import with its results and what Undo import would do
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "200":
          description: The import.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/imports/{importId}/undo:
    post:
      tags:
        - Imports
      operationId: undoImport
      summary: Move every record the import created, with anything added under them since, to the recycle bin
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "200":
          description: Undone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: northstar_session
      description: HttpOnly session cookie set by sign-in.
  parameters:
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
      example: BIN-1001
    FolderId:
      name: folderId
      in: path
      required: true
      schema:
        type: string
      example: SF-1001
    ModelId:
      name: modelId
      in: path
      required: true
      schema:
        type: string
      example: MOD-1001
    ActivityTypeId:
      name: activityTypeId
      in: path
      required: true
      schema:
        type: string
      example: AT-1001
    AttributeId:
      name: attributeId
      in: path
      required: true
      schema:
        type: string
      example: SA-1001
    OptionId:
      name: optionId
      in: path
      required: true
      schema:
        type: string
      example: SO-1001
    CurrencyCode:
      name: code
      in: path
      required: true
      description: The ISO code, which is the currency's id.
      schema:
        type: string
      example: EUR
    BudgetId:
      name: budgetId
      in: path
      required: true
      schema:
        type: string
      example: FB-1001
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
      example: FBI-1001
    LevelPath:
      name: level
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/AttributeLevel"
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
      example: U-1002
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
      example: T-1001
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        type: string
      example: P-1001
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
      example: C-1001
    InitiativeId:
      name: initiativeId
      in: path
      required: true
      schema:
        type: string
      example: I-1001
    Purpose:
      name: purpose
      in: query
      required: true
      description: What the destinations are for. Anything else answers validation_failed on purpose.
      schema:
        type: string
        enum:
          - move
          - copy
    ActivityId:
      name: activityId
      in: path
      required: true
      schema:
        type: string
      example: A-1001
    InitiativeIdPath:
      name: initiativeId
      in: path
      required: true
      schema:
        type: string
      example: I-1001
    LineItemId:
      name: lineItemId
      in: path
      required: true
      schema:
        type: string
      example: L-1001
    RestartApproval:
      name: restartApproval
      in: query
      required: false
      description: >-
        True when the person confirmed "This activity will need approval again" (needed only while the activity is
        Submitted or Approved).
      schema:
        type: boolean
        default: false
    WorkflowId:
      name: workflowId
      in: path
      required: true
      schema:
        type: string
      example: WF-1001
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string
      example: NT-1001
    HomeScope:
      name: scope
      in: query
      required: true
      description: myTeams covers plans with at least one of the person's teams; everything covers all plans.
      schema:
        $ref: "#/components/schemas/HomeScope"
    AllWorkYear:
      name: year
      in: query
      description: The plans' year. Default - the current year.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    AllWorkView:
      name: view
      in: query
      description: grid (default), calendar or budget (Budget & cost).
      schema:
        type: string
        enum:
          - grid
          - calendar
          - budget
        default: grid
    AllWorkPlan:
      name: plan
      in: query
      description: Plan IDs (repeat the parameter for several).
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          example: P-1001
    AllWorkPlanStatus:
      name: planStatus
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - draft
            - published
    AllWorkContainerStatus:
      name: containerStatus
      in: query
      description: Campaign and initiative statuses. OR within Approval progress and within Timing; AND between the two.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - noActivities
            - inProgress
            - allApproved
            - notStarted
            - running
            - finished
    AllWorkActivityStatus:
      name: activityStatus
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - created
            - submitted
            - declined
            - approved
            - inProgress
            - complete
    AllWorkOwner:
      name: owner
      in: query
      description: Person IDs; tested on plans, campaigns, initiatives and activities.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          example: U-1003
    AllWorkTeam:
      name: team
      in: query
      description: Team IDs; tested on the plan's teams.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    AllWorkBusinessUnit:
      name: businessUnit
      in: query
      description: Option IDs of the plan-level Business unit attribute.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    AllWorkActivityType:
      name: activityType
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
    AllWorkStrategic:
      name: strategic
      in: query
      description: Strategic / AOP plans.
      schema:
        type: string
        enum:
          - include
          - only
          - exclude
        default: include
    AllWorkShowLevels:
      name: showLevels
      in: query
      schema:
        type: string
        enum:
          - everything
          - completeBranches
          - campaignsWithoutInitiatives
          - initiativesWithoutActivities
        default: everything
    AllWorkSearch:
      name: search
      in: query
      description: >-
        Text searched in name, ID, external name and description at every level, ignoring letter case (at most 200
        characters).
      schema:
        type: string
    AllWorkColumn:
      name: column
      in: query
      description: Grid columns in display order (repeat the parameter). Name is always shown and is not a column.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          example: plannedCost
    AllWorkSort:
      name: sort
      in: query
      description: A column key and a direction, e.g. plannedCost:desc. Children are sorted within each parent.
      schema:
        type: string
        pattern: ^[A-Za-z0-9._-]+:(asc|desc)$
    AllWorkPeriod:
      name: period
      in: query
      description: Budget & cost columns by month (default) or quarter.
      schema:
        type: string
        enum:
          - month
          - quarter
        default: month
    AllWorkRecordId:
      name: recordId
      in: path
      required: true
      schema:
        type: string
      example: A-1001
    ViewId:
      name: viewId
      in: path
      required: true
      schema:
        type: string
      example: SV-1001
    BulkActionId:
      name: bulkActionId
      in: path
      required: true
      schema:
        type: string
      example: BLK-1001
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
      example: IMP-1001
  responses:
    BadRequest:
      description: >-
        The request is not valid (validation_failed lists every field problem; bad_request when the body cannot be
        read).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Not signed in (sign_in_required), session expired (session_expired) or sign-in failed (incorrect_credentials).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The record or path does not exist (also the demo sign-in paths when demo sign-in is disabled).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: >-
        The record changed meanwhile (version_conflict), a name is taken (name_taken), the record is in use (in_use), a
        restore cannot happen (cannot_restore, restore_parent_first, parent_deleted_permanently), the action is not
        allowed for this person (not_allowed) or needs fields filled first (not_ready, with missing), or an undo or
        restore is no longer possible (undo_expired, already_resolved).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Any other failure (for example internal_error).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - fields
      properties:
        code:
          type: string
          enum:
            - validation_failed
            - bad_request
            - sign_in_required
            - session_expired
            - incorrect_credentials
            - not_found
            - version_conflict
            - restore_parent_first
            - undo_expired
            - already_resolved
            - name_taken
            - internal_error
            - parent_deleted_permanently
            - in_use
            - cannot_restore
            - not_allowed
            - not_ready
        message:
          type: string
          description: Plain-language message for the user (never technical details).
        fields:
          type: array
          description: Every field problem (validation_failed); always present, empty otherwise.
          items:
            $ref: "#/components/schemas/FieldError"
        conflict:
          $ref: "#/components/schemas/Conflict"
        parent:
          $ref: "#/components/schemas/RecordRef"
        resolution:
          $ref: "#/components/schemas/Resolution"
        missing:
          type: array
          description: >-
            Every needed field that stops the action, grouped by record (only with not_ready: publishing a plan,
            submitting an activity).
          items:
            $ref: "#/components/schemas/ReadinessGroup"
      description: >-
        Every failure. Codes added by 002-012: in_use, cannot_restore (002), not_allowed (003), not_ready with missing
        (004), parent_deleted_permanently (011).
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Name of the field in the request body, for example email.
        message:
          type: string
