        colour:
          $ref: "#/components/schemas/TeamColour"
        active:
          type: boolean
        members:
          type: array
          description: The members, active or not, sorted by name.
          items:
            $ref: "#/components/schemas/PersonRef"
        plans:
          type: array
          description: Every plan that uses the team, including plans in the recycle bin, sorted by name; empty until feature 004.
          items:
            $ref: "#/components/schemas/TeamPlanUse"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: "#/components/schemas/ActorRef"
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: "#/components/schemas/ActorRef"
    TeamPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Team"
