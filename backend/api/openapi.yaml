      properties:
        name:
          type: string
        email:
          type: string
        jobTitle:
          type: string
        teamIds:
          type: array
          description: Every team of the person after the change.
          items:
            type: string
        version:
          type: integer
          description: The version the user started editing from.
        managerId:
          type: string
          description: Sent only to change it; empty clears it.
    TeamPlanUse:
