    Error:
      type: object
      additionalProperties: false
      description: Every failure, in one envelope (constitution B6).
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - fields
      properties:
        code:
          type: string
          enum:
            - validation_failed
            - bad_request
            - sign_in_required
            - session_expired
            - incorrect_credentials
            - not_found
            - version_conflict
            - restore_parent_first
            - undo_expired
            - already_resolved
            - name_taken
            - internal_error
            - parent_deleted_permanently
            - in_use
            - cannot_restore
            - not_allowed
            - not_ready
            - forbidden
            - over_budget
        message:
          type: string
          description: Plain-language message for the user (never technical details).
        fields:
          type: array
          description: Every field problem (validation_failed); always present, empty otherwise.
          items:
            $ref: "#/components/schemas/FieldError"
        conflict:
          $ref: "#/components/schemas/Conflict"
        parent:
          $ref: "#/components/schemas/RecordRef"
        resolution:
          $ref: "#/components/schemas/Resolution"
        missing:
          type: array
          description: >-
            Every needed field that stops the action, grouped by record (only with not_ready: publishing a plan,
            submitting an activity).
          items:
            $ref: "#/components/schemas/ReadinessGroup"
      description: "Every failure. Codes added by 002-014: in_use, cannot_restore (002), not_allowed (003), not_ready with missing (004), parent_deleted_permanently (011), forbidden (014: 403, refused by permission or scope; D-299). A record outside the person's access answers 404 not_found, like a missing one (022)."
    FieldError:
      type: object
      additionalProperties: false
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: Name of the field in the request body, for example email.
        message:
          type: string
          description: What is wrong and how to fix it, for example Enter your e-mail.
    Resolution:
      type: object
      additionalProperties: false
      description: How a recycle-bin entry left the bin, by whom and when (already_resolved).
      required:
        - how
        - by
        - at
      properties:
        how:
          type: string
          enum:
            - undone
            - restored
            - deletedPermanently
        by:
          $ref: "#/components/schemas/ActorRef"
        at:
          type: string
          format: date-time
    Conflict:
      type: object
      additionalProperties: false
      description: >-
        Who changed the record after the user opened it (version_conflict). The web app shows the time in the user's
        local time.
      required:
        - changedBy
        - changedAt
      properties:
        changedBy:
          type: string
          example: Daniel Okoro
        changedAt:
          type: string
          format: date-time
    RecordRef:
      type: object
      additionalProperties: false
      required:
        - type
        - id
        - name
      properties:
        type:
          type: string
          example: sampleFolder
        id:
          type: string
          example: SF-1001
        name:
          type: string
    ActorRef:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: U-1002
        name:
          type: string
          example: Priya Raman
    Environment:
