          type: integer
    TeamCreate:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
          description: Empty when not sent.
        colour:
          type: string
          description: >-
            One of TeamColour; when not sent, the colour used by the fewest teams. Any other value answers
            validation_failed.
        memberIds:
          type: array
          description: The members; empty when not sent.
          items:
            type: string
    TeamUpdate:
      type: object
      additionalProperties: false
      description: >-
        Only the fields to change, and the version (D-203, D-210); a field left out keeps its value. Also the body of
        the impact check, where members that are not sent are not removed.
      required:
        - version
      properties:
        name:
          type: string
        description:
          type: string
        colour:
          type: string
          description: One of TeamColour; any other value answers validation_failed.
        memberIds:
          type: array
          description: Every member after the change.
          items:
            type: string
        version:
          type: integer
          description: The version the user started editing from.
    ProfileUpdate:
      type: object
      additionalProperties: false
      required:
        - name
        - jobTitle
