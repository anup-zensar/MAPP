    DisplayCurrencyOption:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - active
      properties:
        code:
          type: string
          example: EUR
        name:
          type: string
          example: Euro
        active:
          type: boolean
          description: False only for the person's current display currency after it was set inactive.
    DisplayCurrencyPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DisplayCurrencyOption"
        total:
          type: integer
    DateFormat:
      type: string
      description: How dates are shown and typed (default DD MMM YYYY, "12 Mar 2026").
      enum:
        - DD MMM YYYY
        - DD/MM/YYYY
        - MM/DD/YYYY
        - YYYY-MM-DD
    PlanStatus:
      type: string
      enum:
        - draft
        - published
      description: Draft (being prepared) or Published (the agreed plan of record).
    GoalStage:
      type: string
      enum:
        - inq
        - mql
        - revenue
      description: The stage at which the plan's goal is set (INQ, MQL or Revenue).
    SpreadMethod:
      type: string
      enum:
        - evenly
        - firstMonth
        - lastMonth
        - custom
      description: >-
        How a line item's planned cost is spread over the months (Evenly, All in first month, All in last month,
        Custom). Reused by feature 007.
    ApprovalProgress:
      type: string
      enum:
        - noActivities
        - inProgress
        - allApproved
    ModelSummary:
      type: object
      additionalProperties: false
      description: >-
        The plan's model with what the goal waterfall needs (owned by 004; read from 002's Model). Inactive models are
        labelled "(inactive)".
      required:
        - id
        - name
        - active
        - inqToMqlRate
        - mqlToDealRate
        - averageDealSize
      properties:
        id:
          type: string
          example: MOD-1001
        name:
          type: string
          example: Lubricants 1.0
        active:
          type: boolean
        inqToMqlRate:
          $ref: "#/components/schemas/Percent"
        mqlToDealRate:
          $ref: "#/components/schemas/Percent"
        averageDealSize:
          $ref: "#/components/schemas/Money"
    FinanceBudgetRef:
      type: object
      additionalProperties: false
      description: >-
        A finance budget (002) referred to by a plan; its name is read when the answer is made, so a rename shows
        everywhere.
      required:
        - id
        - year
        - name
      properties:
        id:
          type: string
          example: FB-1001
        year:
          type: integer
          example: 2026
        name:
          type: string
          example: 2026 Lubricants Budget
    OptionRef:
      type: object
      additionalProperties: false
      description: >-
        A Shell attribute option (002) referred to by a record, such as the plan's business unit. Inactive options are
        labelled "(inactive)".
      required:
        - id
        - label
        - active
      properties:
        id:
          type: string
          example: SO-1001
        label:
          type: string
          example: Lubricants
        active:
          type: boolean
    AttentionItem:
      type: object
      additionalProperties: false
      description: A record below that is not complete, with its missing fields.
      required:
        - record
        - missing
      properties:
        record:
          $ref: "#/components/schemas/RecordRef"
        missing:
          type: array
          items:
            $ref: "#/components/schemas/MissingField"
    Completeness:
      type: object
      additionalProperties: false
      required:
        - missing
        - itemsBelow
      properties:
        missing:
          type: array
          description: The record's own needed fields that are empty, in form order ("All filled in" when empty).
          items:
            $ref: "#/components/schemas/MissingField"
        itemsBelow:
          type: array
          description: Every campaign, initiative, activity and line item below that is not complete.
          items:
            $ref: "#/components/schemas/AttentionItem"
    ReadinessGroup:
      type: object
      additionalProperties: false
      description: The fields one record still needs before an action (publish a plan; later submit an activity).
      required:
        - record
        - fields
      properties:
        record:
          $ref: "#/components/schemas/RecordRef"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/MissingField"
    PlanContents:
      type: object
      additionalProperties: false
      description: What is inside the plan (0 until features 005-007 add their records).
      required:
        - campaigns
        - initiatives
        - activities
        - approvedActivities
        - lineItems
      properties:
        campaigns:
          type: integer
          minimum: 0
        initiatives:
          type: integer
          minimum: 0
        activities:
          type: integer
          minimum: 0
        approvedActivities:
          type: integer
          minimum: 0
          description: Activities that are Approved, In progress or Complete.
        lineItems:
          type: integer
          minimum: 0
    PlanFigures:
      type: object
      additionalProperties: false
      description: Calculated money and progress, in the signed-in person's display currency.
      required:
        - currency
        - budget
        - plannedCost
        - campaignBudgets
        - remainingBudget
        - overAllocatedBy
        - budgetUsedPercent
        - overBudget
        - activities
        - activitiesApproved
        - approvalProgress
      properties:
        currency:
          type: string
          description: The display currency code of every amount below.
          example: USD
        budget:
          description: The plan budget; null when none is set.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        plannedCost:
          description: Sum of the activities' planned cost; null when nothing below has a planned cost.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        campaignBudgets:
          $ref: "#/components/schemas/Money"
        remainingBudget:
          description: Plan budget minus campaign budgets (may be negative); null without a plan budget.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        overAllocatedBy:
          description: How far campaign budgets exceed the plan budget; null when they do not.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        budgetUsedPercent:
          type:
            - integer
            - "null"
          description: Planned cost divided by plan budget, as a whole percent; null without a budget or with a budget of 0.
        overBudget:
          type: boolean
          description: Planned cost is above the plan budget (the bar is red).
        activities:
          type: integer
          minimum: 0
        activitiesApproved:
          type: integer
          minimum: 0
        approvalProgress:
          $ref: "#/components/schemas/ApprovalProgress"
    GoalFigures:
      type: object
      additionalProperties: false
      description: The plan goal at every stage; the typed stage as typed, the others calculated from the model.
      required:
        - inq
        - mql
        - deals
        - revenue
        - reasons
      properties:
        inq:
          type:
            - integer
            - "null"
        mql:
          type:
            - integer
            - "null"
        deals:
          type:
            - integer
            - "null"
        revenue:
          description: In the display currency.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        reasons:
          type: object
          additionalProperties: false
          description: Why a stage could not be calculated (only for stages that are null although a goal amount is set).
          properties:
            inq:
              type: string
            mql:
              type: string
            deals:
              type: string
            revenue:
              type: string
    GoalTotals:
      type: object
      additionalProperties: false
      description: The sum of the goals of every activity in the plan.
      required:
        - inq
        - mql
        - revenue
      properties:
        inq:
          type: integer
          minimum: 0
        mql:
          type: integer
          minimum: 0
        revenue:
          $ref: "#/components/schemas/Money"
    PlanGoals:
      type: object
      additionalProperties: false
      required:
        - stage
        - plan
        - activities
        - plannedPercent
      properties:
        stage:
          $ref: "#/components/schemas/GoalStage"
        plan:
          $ref: "#/components/schemas/GoalFigures"
        activities:
          $ref: "#/components/schemas/GoalTotals"
        plannedPercent:
          type:
            - integer
            - "null"
          description: >-
            Activity total of the goal stage as a whole percent of the plan goal; null without a goal or with a goal of
            0.
    Plan:
      type: object
      additionalProperties: false
      description: A plan as stored (stored amounts in USD) with its calculated values (display currency).
      required:
        - overspend
        - id
        - name
        - year
        - status
        - model
        - teams
        - owner
        - ownerProblem
        - aop
        - description
        - budget
        - defaultFinanceBudget
        - defaultSpread
        - bcpir
        - goalStage
        - goalAmount
        - attributes
        - businessUnit
        - figures
        - goals
        - completeness
        - contents
        - version
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
      properties:
        overspend:
          $ref: "#/components/schemas/OverspendControl"
        id:
          type: string
          example: P-1001
        name:
          type: string
          example: FY2026 Lubricants Europe
        year:
          type: integer
          example: 2026
        status:
          $ref: "#/components/schemas/PlanStatus"
        model:
          $ref: "#/components/schemas/ModelSummary"
        teams:
          type: array
          description: Sorted by name; inactive teams are kept and flagged.
          items:
            $ref: "#/components/schemas/TeamRef"
        owner:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        ownerProblem:
          type: string
          description: The R1 message when the owner is in none of the plan's teams; empty otherwise.
        aop:
          type: boolean
          description: Strategic / AOP plan.
        description:
          type: string
        budget:
          description: "The plan budget in the plan currency (016), as stored and typed; null when none."
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        defaultFinanceBudget:
          oneOf:
            - $ref: "#/components/schemas/FinanceBudgetRef"
            - type: "null"
        defaultSpread:
          $ref: "#/components/schemas/SpreadMethod"
        bcpir:
          type: boolean
          description: BCPIR plan.
        goalStage:
          $ref: "#/components/schemas/GoalStage"
        goalAmount:
          type:
            - string
            - "null"
          description: The typed goal; a whole number for inq and mql, a USD amount for revenue.
          example: "250000"
        attributes:
          type: object
          description: Plan-level Shell attribute values by attribute ID, including hidden ones (kept, R9).
          additionalProperties:
            $ref: "#/components/schemas/AttributeValue"
        businessUnit:
          type: array
          description: The chosen options of the Business unit attribute.
          items:
            $ref: "#/components/schemas/OptionRef"
        figures:
          $ref: "#/components/schemas/PlanFigures"
        goals:
          $ref: "#/components/schemas/PlanGoals"
        completeness:
          $ref: "#/components/schemas/Completeness"
        contents:
          $ref: "#/components/schemas/PlanContents"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: "#/components/schemas/ActorRef"
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: "#/components/schemas/ActorRef"
        access:
          $ref: "#/components/schemas/PlanAccess"
          description: "What the viewer may do with this plan (014). Optional in the contract; always sent once its feature is built (D-298)."
        allocation:
          description: "The global-budget allocation that sets this plan's budget (014 FR-031); null when none. Optional in the contract; always sent once its feature is built (D-298)."
          oneOf:
            - $ref: "#/components/schemas/PlanAllocation"
            - type: "null"
        currency:
          description: "016. Optional in the contract; always sent once its feature is built (D-298)."
          type: string
        planType:
          description: "016. Optional in the contract; always sent once its feature is built (D-298)."
          $ref: "#/components/schemas/PlanType"
        budgetPhasing:
          description: "016. Optional in the contract; always sent once its feature is built (D-298)."
          $ref: "#/components/schemas/BudgetPhasing"
        planFigures:
          description: The figures in the plan currency (figures stays in the display currency).
