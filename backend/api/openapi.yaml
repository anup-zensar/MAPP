        - inqToMqlRate
        - mqlToDealRate
        - averageDealSize
        - active
      properties:
        id:
          type: string
        name:
          type: string
          example: Lubricants 1.0
        inqToMqlRate:
          type: string
          description: Percent with two decimals.
          example: "2.00"
        mqlToDealRate:
          type: string
          description: Percent with two decimals.
          example: "5.00"
        averageDealSize:
          $ref: "#/components/schemas/Money"
        active:
          type: boolean
    ActivityBusinessUnit:
      type: object
      additionalProperties: false
      required:
        - id
        - label
      properties:
        id:
          type: string
          description: The option id of the plan-level Business unit attribute.
        label:
          type: string
          example: Lubricants
    ActivityFormContext:
      type: object
      additionalProperties: false
      required:
        - plan
        - campaign
        - initiative
        - model
        - businessUnits
        - latestEndDate
      properties:
        plan:
          $ref: "#/components/schemas/ActivityPlanFacts"
        campaign:
          $ref: "#/components/schemas/RecordRef"
        initiative:
          $ref: "#/components/schemas/ActivityInitiativeFacts"
        model:
          $ref: "#/components/schemas/ActivityModelFacts"
        businessUnits:
          type: array
          description: The business units the plan includes (empty when none is set).
          items:
            $ref: "#/components/schemas/ActivityBusinessUnit"
        latestEndDate:
          type: string
          format: date
          description: 31 December of the plan's year + 10 (R5).
    ActivityTypeOption:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - defaultPlannedCost
        - active
        - allowed
      properties:
        id:
          type: string
        name:
          type: string
        defaultPlannedCost:
          description: "The default converted into the plan currency at the current rate (016 FR-016)."
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        active:
          type: boolean
        allowed:
          type: boolean
        defaultPlannedCostUsd:
          description: The type's default as kept in Settings (USD), for the conversion note.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
    ActivityWorkflowLevel:
      type: object
      additionalProperties: false
      required:
        - name
        - approvers
      properties:
        name:
          type: string
          example: Level 1
        approvers:
          type: array
          items:
            $ref: "#/components/schemas/PersonRef"
    ActivityWorkflowOption:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - active
        - levels
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean
        levels:
          type: array
          items:
            $ref: "#/components/schemas/ActivityWorkflowLevel"
    ActivityDefaults:
      type: object
      additionalProperties: false
      description: What a new activity starts with.
      required:
        - owner
        - startDate
        - endDate
        - approvalWorkflowId
      properties:
        owner:
          description: The initiative's owner, when active.
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        startDate:
          type:
            - string
            - "null"
          format: date
        endDate:
          type:
            - string
            - "null"
          format: date
        approvalWorkflowId:
          type:
            - string
            - "null"
          description: Set when exactly one approval workflow is active.
    ActivityForm:
      type: object
      additionalProperties: false
      required:
        - overspendLimits
        - context
        - activityTypes
        - approvalWorkflows
        - attributes
        - existingNames
        - defaults
      properties:
        overspendLimits:
          type: array
          description: Every budget above the activity set to Refuse, with what is left to plan in it (037 FR-014).
          items:
            $ref: "#/components/schemas/OverspendLimit"
        context:
          $ref: "#/components/schemas/ActivityFormContext"
        activityTypes:
          type: array
          description: >-
            The active types the plan's model allows, sorted by name; for an edit also the current type when inactive or
            not allowed.
          items:
            $ref: "#/components/schemas/ActivityTypeOption"
        approvalWorkflows:
          type: array
          description: The active approval workflows, sorted by name; for an edit also the current one when inactive.
          items:
            $ref: "#/components/schemas/ActivityWorkflowOption"
        attributes:
          type: array
          description: >-
            The activity-level Shell attributes in section and display order (active ones, plus inactive ones holding a
            value of this activity).
          items:
            $ref: "#/components/schemas/ShellAttribute"
        existingNames:
          type: array
          description: Names of the other activities in the initiative, for the uniqueness check while typing.
          items:
            type: string
        defaults:
          description: Only for a new activity; null for an edit.
          oneOf:
            - $ref: "#/components/schemas/ActivityDefaults"
            - type: "null"
    SwbsStatus:
      type: string
      description: >-
        received when the line item has its SWBS code (it stays whatever happens to the activity); notRequested when
        Request SWBS code from GSAP is off; readyToSend once the activity is Approved; waitingForApproval otherwise
        (domain model §2.4, 030 FR-001).
      enum:
        - notRequested
        - waitingForApproval
        - readyToSend
        - received
    LineItemCurrency:
      type: object
      additionalProperties: false
      description: A currency as the line-item screens need it.
      required:
        - code
        - name
        - symbol
        - ratePerUsd
        - active
      properties:
        code:
          type: string
          example: EUR
        name:
          type: string
          example: Euro
        symbol:
          type: string
          description: Empty when none is set.
          example: €
        ratePerUsd:
          type: string
          description: >-
            The current rate in units of this currency per 1 USD, as a decimal string with up to six decimals (USD is
            1).
          example: "0.92"
        active:
          type: boolean
          description: False for an inactive currency, kept on a line item and still converting at its last rate.
        rateDate:
          description: "016. Optional in the contract; always sent once its feature is built (D-298)."
          type: [string, "null"]
          format: date
        rateSource:
          description: "016. Optional in the contract; always sent once its feature is built (D-298)."
          oneOf:
            - $ref: "#/components/schemas/RateSource"
            - type: "null"
    FinanceBudgetItemRef:
      type: object
      additionalProperties: false
      required:
        - id
        - year
        - budgetName
        - name
        - code
        - active
      properties:
        id:
          type: string
        year:
          type: integer
          example: 2026
        budgetName:
          type: string
          example: 2026 Lubricants Budget
        name:
          type: string
          example: Europe – Digital
        code:
          type: string
          description: Empty when the item has no code.
          example: LUB-EU-DIG
        active:
          type: boolean
    SpreadMonth:
      type: object
      additionalProperties: false
      required:
        - month
        - amount
        - amountUsd
        - outsideActivityDates
      properties:
        month:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          example: 2026-03
        amount:
          description: The month's amount in the line item's currency.
          $ref: "#/components/schemas/Money"
        amountUsd:
          description: >-
            The month's amount in USD; the rounding cent is in the last month with an amount, so the months add up
            exactly (D-024).
          $ref: "#/components/schemas/Money"
        outsideActivityDates:
          type: boolean
          description: True for a custom month outside the activity's dates (allowed, e.g. a deposit).
    Spread:
      type: object
      additionalProperties: false
      required:
        - method
        - state
        - months
        - customTotal
        - addsUp
      properties:
        method:
          $ref: "#/components/schemas/SpreadMethod"
        state:
          type: string
          description: >-
            notSpread when the method is evenly, firstMonth or lastMonth and the activity has no dates yet (its amount
            is then in the grid's No dates yet column); spread otherwise.
          enum:
            - spread
            - notSpread
        months:
          type: array
          description: The month amounts, sorted by month; empty when notSpread.
          items:
            $ref: "#/components/schemas/SpreadMonth"
        customTotal:
          description: The sum of the custom month amounts in the line item's currency; null for the other methods.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        addsUp:
          type: boolean
          description: >-
            Always true for evenly, firstMonth and lastMonth; for custom, true when the months add up exactly to the
            planned cost.
    SpreadMonthInput:
      type: object
      additionalProperties: false
      required:
        - month
        - amount
      properties:
        month:
          type: string
          description: YYYY-MM, from January of the plan's year − 1 to December of the plan's year + 10.
          example: 2026-02
        amount:
          type: string
          description: Decimal amount in the line item's currency, 0 or more.
          example: "2000.00"
    SpreadInput:
      type: object
      additionalProperties: false
      required:
        - method
        - months
      properties:
        method:
          $ref: "#/components/schemas/SpreadMethod"
        months:
          type: array
          description: The custom month amounts; stored only when method is custom (an empty list is stored otherwise).
          items:
            $ref: "#/components/schemas/SpreadMonthInput"
    LineItem:
      type: object
      additionalProperties: false
      required:
        - id
        - activityId
        - name
        - owner
        - description
        - currency
        - plannedCost
        - plannedCostUsd
        - plannedCostDisplay
        - spread
        - attributes
        - contractedAmount
        - requestSwbs
        - swbsStatus
        - swbsCode
        - swbsRequestedAt
        - swbsReceivedAt
        - hxKey
        - financeBudgetYear
        - financeBudgetItem
        - missing
        - version
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
      properties:
        id:
          type: string
          example: L-1001
        activityId:
          type: string
          example: A-1042
        name:
          type: string
          example: Agency fee
        owner:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        description:
          type: string
        currency:
          $ref: "#/components/schemas/LineItemCurrency"
        plannedCost:
          description: Planned cost in the line item's currency.
          $ref: "#/components/schemas/Money"
        plannedCostUsd:
          description: >-
            Planned cost converted to USD at the currency's current rate, rounded half-up to the cent (domain model
            §4.3). Always USD: the unassigned balance and the spread add it up, and the line-item form calculates with
            it.
          $ref: "#/components/schemas/Money"
        plannedCostDisplay:
          description: >-
            plannedCostUsd in the signed-in person's display currency at its current rate, rounded half-up to the cent
            (007 FR-005, D-061, D-213); the same as plannedCostUsd for a person who shows amounts in USD. The section's
            "Planned cost (<code>)" column.
          $ref: "#/components/schemas/Money"
        spread:
          $ref: "#/components/schemas/Spread"
        attributes:
          $ref: "#/components/schemas/AttributeValues"
        contractedAmount:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        requestSwbs:
          type: boolean
        swbsStatus:
          $ref: "#/components/schemas/SwbsStatus"
        swbsCode:
          type: string
          description: The SWBS code GSAP returned, read-only; empty until received (030 FR-002).
          example: SIM-GB01-0001
        swbsRequestedAt:
          description: When the SWBS request was sent; null until then.
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        swbsReceivedAt:
          description: When the SWBS code was received; null until then.
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        hxKey:
          type: string
          description: '"HX" followed by the digits of the line item''s ID, the key GSAP data is matched on (030 FR-016).'
          example: HX1006
        financeBudgetYear:
          oneOf:
            - type: integer
            - type: "null"
        financeBudgetItem:
          oneOf:
            - $ref: "#/components/schemas/FinanceBudgetItemRef"
            - type: "null"
        missing:
          type: array
          description: >-
            What still blocks submitting the activity, in order — empty needed-to-submit fields, an inactive finance
            budget item, a custom spread that doesn't add up (FR-028). Empty when all is filled in.
          items:
            $ref: "#/components/schemas/MissingField"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: "#/components/schemas/ActorRef"
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: "#/components/schemas/ActorRef"
        plannedCostPlan:
          description: Planned cost in the plan currency at the current rates (016 FR-015).
          $ref: "#/components/schemas/Money"
    LineItemActivity:
      type: object
      additionalProperties: false
      description: What the line-item screens need to know about the activity.
      required:
        - id
        - name
        - status
        - restartsApproval
        - startDate
        - endDate
        - ongoing
        - plannedCost
        - path
        - planYear
        - defaultSpreadMethod
        - defaultFinanceBudget
        - businessUnitOptionIds
      properties:
        id:
          type: string
          example: A-1042
        name:
          type: string
          example: Launch film
        status:
          $ref: "#/components/schemas/ActivityStatus"
        restartsApproval:
          type: boolean
          deprecated: true
          description: >-
            Always false since feature 034 (D-322) - a line-item change never sends the activity back for approval.
            Kept for older clients.
        startDate:
          oneOf:
            - type: string
              format: date
            - type: "null"
        endDate:
          oneOf:
            - type: string
              format: date
            - type: "null"
        ongoing:
          type: boolean
        plannedCost:
          description: The activity's planned cost in USD; null while it has none.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        path:
          type: array
          description: The activity's plan, campaign and initiative, top level first (for the breadcrumb).
          items:
            $ref: "#/components/schemas/RecordRef"
        planYear:
          type: integer
          example: 2026
        defaultSpreadMethod:
          $ref: "#/components/schemas/SpreadMethod"
        defaultFinanceBudget:
          description: The name of the plan's default finance budget (of the plan's year); null when none is set.
          oneOf:
            - type: string
            - type: "null"
        businessUnitOptionIds:
          type: array
          description: >-
            The Business unit options of the activity's plan. A line-item Shell attribute with a business-unit
            condition is shown only when one of them is in its condition (002 FR-023, D-212).
          items:
            type: string
          example:
            - SO-1001
    UnassignedBalance:
      type: object
      additionalProperties: false
      description: "Unassigned planned cost (Sys_Gen_Balance) = activity planned cost − sum of its line items' planned costs in the plan currency (domain model §4.3; 016 FR-015). Worked out in the plan currency; answered in the signed-in person's display currency in LineItemSection and LineItemDetails (each converted once, D-213) and in the plan currency in LineItemFormOptions, where the form calculates \"After saving\" from the typed amount (D-061: the web app never converts). Every amount says its currency."
      required:
        - plannedCost
        - assigned
        - balance
        - state
        - roundingHint
      properties:
        plannedCost:
          description: The activity's planned cost; null while it has none.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        assigned:
          description: "Sum of the line items' planned costs in the plan currency."
          $ref: "#/components/schemas/Money"
        balance:
          description: Negative when line items exceed the planned cost; null while the activity has no planned cost.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        state:
          type: string
          enum:
            - left
            - allAssigned
            - exceeded
            - noPlannedCost
        roundingHint:
          type: boolean
          description: >-
            True when a few cents (at most 0.05 USD, measured in USD) remain either way and a line item uses another
            currency than USD.
    SpreadGridColumn:
      type: object
      additionalProperties: false
      required:
        - key
        - month
        - outsideActivityDates
      properties:
        key:
          type: string
          description: The month (YYYY-MM) or noDates.
          example: 2026-03
        month:
          oneOf:
            - type: string
            - type: "null"
          description: The month (YYYY-MM); null for the No dates yet column.
        outsideActivityDates:
          type: boolean
    SpreadGridRow:
      type: object
      additionalProperties: false
      required:
        - lineItemId
        - name
        - cells
        - total
      properties:
        lineItemId:
          type: string
        name:
          type: string
        cells:
          type: array
          description: One per column, in the grid's currency; null where the line item has nothing.
          items:
            oneOf:
              - $ref: "#/components/schemas/Money"
              - type: "null"
        total:
          $ref: "#/components/schemas/Money"
    SpreadGrid:
      type: object
      additionalProperties: false
      description: "The activity's line items by month (FR-003, FR-020), worked out in the plan currency (016 FR-015) and answered in the signed-in person's display currency (007 FR-005, D-213): every cell and total is converted on its own, so a total can differ by a cent from the sum of its converted cells; in the plan currency they add up exactly. Quarterly is calculated by the web app."
      required:
        - columns
        - rows
        - totals
        - total
      properties:
        columns:
          type: array
          items:
            $ref: "#/components/schemas/SpreadGridColumn"
        rows:
          type: array
          items:
            $ref: "#/components/schemas/SpreadGridRow"
        totals:
          type: array
          description: The total of each column; null when every cell of the column is empty.
          items:
            oneOf:
              - $ref: "#/components/schemas/Money"
              - type: "null"
        total:
          $ref: "#/components/schemas/Money"
    LineItemSection:
      type: object
      additionalProperties: false
      required:
        - activity
        - items
        - balance
        - grid
      properties:
        activity:
          $ref: "#/components/schemas/LineItemActivity"
        items:
          type: array
          description: The activity's line items in creation order.
          items:
            $ref: "#/components/schemas/LineItem"
        balance:
          $ref: "#/components/schemas/UnassignedBalance"
        grid:
          $ref: "#/components/schemas/SpreadGrid"
        access:
          $ref: "#/components/schemas/LineItemAccess"
          description: "014. Optional in the contract; always sent once its feature is built (D-298)."
    LineItemDetails:
      type: object
      additionalProperties: false
      required:
        - lineItem
        - activity
        - balance
      properties:
        lineItem:
          $ref: "#/components/schemas/LineItem"
        activity:
          $ref: "#/components/schemas/LineItemActivity"
        balance:
          description: >-
            The activity's unassigned planned cost now, with this line item included, in the signed-in person's display
            currency (D-213).
          $ref: "#/components/schemas/UnassignedBalance"
        access:
          $ref: "#/components/schemas/LineItemAccess"
          description: "014. Optional in the contract; always sent once its feature is built (D-298)."
    LineItemDefaults:
      type: object
      additionalProperties: false
      description: What a new line item starts with (FR-008). The web app labels each value with its source.
      required:
        - name
        - owner
        - currency
        - plannedCost
        - plannedCostSource
        - spreadMethod
        - financeBudgetYear
        - financeBudgetItemId
        - financeBudgetItemPreselected
        - requestSwbs
      properties:
        name:
          type: string
          example: Launch film – line item
        owner:
          description: The activity's owner; null when it has none.
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        currency:
          type: string
          example: USD
        plannedCost:
          description: The unassigned planned cost (USD) when it is above 0.00; null otherwise.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        plannedCostSource:
          type: string
          enum:
            - unassignedBalance
            - nothingLeftToAssign
            - noActivityPlannedCost
        spreadMethod:
          $ref: "#/components/schemas/SpreadMethod"
        financeBudgetYear:
          type: integer
          description: The plan's year.
        financeBudgetItemId:
          description: The only active item of the plan's default finance budget, when it has exactly one (R12); null otherwise.
          oneOf:
            - type: string
            - type: "null"
        financeBudgetItemPreselected:
          type: boolean
        requestSwbs:
          type: boolean
          const: true
    LineItemFormOptions:
      type: object
      additionalProperties: false
      required:
        - activity
        - balance
        - defaults
        - currencies
        - financeBudgetYears
        - financeBudgetItems
      properties:
        activity:
          $ref: "#/components/schemas/LineItemActivity"
        balance:
          description: >-
            The unassigned planned cost in USD, the currency the form calculates "After saving" in (D-213).
          $ref: "#/components/schemas/UnassignedBalance"
        defaults:
          $ref: "#/components/schemas/LineItemDefaults"
        currencies:
          type: array
          description: The active currencies, USD first, then by code.
          items:
            $ref: "#/components/schemas/LineItemCurrency"
        financeBudgetYears:
          type: array
          description: The plan's year and every year with active finance budget items, ascending.
          items:
            type: integer
        financeBudgetItems:
          type: array
          description: >-
            The active items of those years — by year, then the plan's default finance budget first (in the plan's
            year), then by budget name and item name.
          items:
            $ref: "#/components/schemas/FinanceBudgetItemRef"
    LineItemCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - ownerId
        - description
        - currency
        - plannedCost
        - spread
        - attributes
        - contractedAmount
        - requestSwbs
        - financeBudgetYear
        - financeBudgetItemId
      properties:
        name:
          type: string
        ownerId:
          description: A person id; null for no owner.
          oneOf:
            - type: string
            - type: "null"
        description:
          type: string
        currency:
          type: string
          description: The line item's currency (ISO code); every amount of the request is in it.
          example: EUR
        plannedCost:
          description: Decimal amount in the currency; null when the field is empty (refused with "Enter the planned cost.").
          oneOf:
            - type: string
            - type: "null"
          example: "46000.00"
        spread:
          $ref: "#/components/schemas/SpreadInput"
        attributes:
          $ref: "#/components/schemas/AttributeValues"
        contractedAmount:
          description: Decimal amount in the currency; null when empty.
          oneOf:
            - type: string
            - type: "null"
        requestSwbs:
          type: boolean
        financeBudgetYear:
          oneOf:
            - type: integer
            - type: "null"
        financeBudgetItemId:
          oneOf:
            - type: string
            - type: "null"
        restartApproval:
          type: boolean
          deprecated: true
          description: Ignored since feature 034 (D-322).
    LineItemUpdate:
      type: object
      additionalProperties: false
      required:
        - name
        - ownerId
        - description
        - currency
        - plannedCost
        - spread
        - attributes
        - contractedAmount
        - requestSwbs
        - financeBudgetYear
        - financeBudgetItemId
        - version
      properties:
        name:
          type: string
        ownerId:
          oneOf:
            - type: string
            - type: "null"
        description:
          type: string
        currency:
          type: string
        plannedCost:
          oneOf:
            - type: string
            - type: "null"
        spread:
          $ref: "#/components/schemas/SpreadInput"
        attributes:
          $ref: "#/components/schemas/AttributeValues"
        contractedAmount:
          oneOf:
            - type: string
            - type: "null"
        requestSwbs:
          type: boolean
        financeBudgetYear:
          oneOf:
            - type: integer
            - type: "null"
        financeBudgetItemId:
          oneOf:
            - type: string
            - type: "null"
        restartApproval:
          type: boolean
          deprecated: true
          description: Ignored since feature 034 (D-322).
        version:
          type: integer
          description: The version the person started editing from.
    LineItemDuplicate:
      type: object
      additionalProperties: false
      properties:
        restartApproval:
          type: boolean
          deprecated: true
          description: Ignored since feature 034 (D-322).
    ApprovalPerson:
      type: object
      additionalProperties: false
      description: A designated approver or owner, with the live active flag ("(inactive)").
      required:
        - id
        - name
        - initials
        - active
      properties:
        id:
          type: string
