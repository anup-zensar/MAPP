        recordType:
          type: string
        recordTypeLabel:
          type: string
          description: Mid-sentence name of the record type, for example sample folder.
        recordId:
          type: string
        recordName:
          type: string
        path:
          type: array
          description: Where the record was when it was deleted, top level first.
          items:
            $ref: "#/components/schemas/RecordRef"
        parent:
