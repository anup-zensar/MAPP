      properties:
        password:
          type: string
          description: The shared demo password, shown on the sign-in page.
          example: mapp
        people:
          type: array
          items:
            $ref: "#/components/schemas/DemoPerson"
    SignInRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
    Preferences:
      type: object
      additionalProperties: false
      required:
        - theme
        - sidebarCollapsed
        - pinnedPlanIds
      properties:
        theme:
          type: string
          enum:
            - system
            - light
            - dark
          description: system follows the computer's setting.
        sidebarCollapsed:
          type: boolean
        displayCurrency:
          type: string
          description: ISO code of the currency the API converts USD amounts to for this person (default USD).
          example: USD
        dateFormat:
          $ref: "#/components/schemas/DateFormat"
        homeScope:
          $ref: "#/components/schemas/HomeScope"
        historyIncludeInside:
          type: boolean
          description: Include items inside / Include line items on History sections (default false).
        pinnedPlanIds:
          type: array
          maxItems: 100
          items:
            type: string
            pattern: "^P-\\d+$"
          description: >-
            The ids of the plans the person pinned on the Plans list, in the order they pinned them (insertion
            order); [] when none — always sent, never null (018, D-317). An id may name a plan that no longer
            exists or is out of sight; the list simply doesn't show it.
      description: >-
        Extended by later features: displayCurrency (003), dateFormat (003), homeScope (009), historyIncludeInside
        (011), pinnedPlanIds (018). Properties beyond the required list are always sent by the feature that adds them;
        they stay optional so that earlier answers remain valid (D-191). pinnedPlanIds is in the required list (018):
        it was born always sent and never null.
    PreferencesUpdate:
      type: object
      additionalProperties: false
      description: >-
        Only the preferences to change. Extended by later features: displayCurrency (003), dateFormat (003), homeScope
        (009), historyIncludeInside (011), pinnedPlanIds (018). Properties beyond the required list are always sent by
        the feature that adds them; they stay optional so that earlier answers remain valid (D-191).
      properties:
        theme:
          type: string
          enum:
            - system
            - light
            - dark
          description: The server also checks the value and answers validation_failed for anything else.
        sidebarCollapsed:
          type: boolean
        displayCurrency:
          type: string
          description: An active currency's code, or the current one. Anything else answers validation_failed.
        dateFormat:
          type: string
          description: One of DateFormat. Anything else answers validation_failed.
        homeScope:
          type: string
          enum:
            - myTeams
            - everything
          description: The server also checks the value and answers validation_failed for anything else.
        historyIncludeInside:
          type: boolean
        pinnedPlanIds:
          type: array
          maxItems: 100
          items:
            type: string
            pattern: "^P-\\d+$"
          description: >-
            Every pinned plan after the change, in the order pinned (018, D-317). Duplicates are dropped, keeping
            the order sent; the server also checks each id (^P-\d+$) and the cap of 100 and answers
            validation_failed otherwise. Ids of deleted or out-of-sight plans are allowed — they are harmless.
    CurrentUser:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - firstName
        - email
        - jobTitle
        - initials
        - preferences
      properties:
        id:
          type: string
        name:
          type: string
        firstName:
          type: string
        email:
          type: string
        jobTitle:
          type: string
        initials:
          type: string
        preferences:
          $ref: "#/components/schemas/Preferences"
        version:
          type: integer
          minimum: 1
          description: The person's version, sent back by PATCH /api/v1/me.
        teams:
          type: array
          description: The signed-in person's teams, active or not, sorted by name ("My teams" filters, plan defaults).
          items:
            $ref: "#/components/schemas/TeamRef"
        access:
          $ref: "#/components/schemas/MyAccess"
          description: "The person's roles, permissions with scopes, administrators and access rule (014). Optional in the contract; always sent once its feature is built (D-298)."
      description: >-
        Extended by later features: version (003), teams (003). Properties beyond the required list are always sent by
        the feature that adds them; they stay optional so that earlier answers remain valid (D-191).
    Change:
      type: object
      additionalProperties: false
      required:
        - field
        - label
        - old
        - new
        - oldText
        - newText
      properties:
        field:
          type: string
          example: name
        label:
          type: string
          description: The field's name for people, fixed at the time.
          example: Name
        old:
          description: The stored value before the change (any JSON value).
        new:
          description: The stored value after the change (any JSON value).
        oldText:
          type: string
          description: The value before the change as people read it (Not filled in when empty).
        newText:
          type: string
          description: The value after the change as people read it (Not filled in when empty).
    ActivityLogEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - seq
        - at
        - actor
        - action
        - verb
        - recordType
        - recordTypeLabel
        - recordId
        - recordName
        - path
        - changes
        - comment
        - details
      properties:
        id:
          type: string
          example: LOG-1001
        seq:
          type: integer
        at:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/ActorRef"
        action:
          type: string
          enum:
            - created
            - changed
            - statusChanged
            - moved
            - copied
            - deleted
            - restored
            - deletedPermanently
            - emptiedRecycleBin
          description: Category used for filters and the action chip (feature 011 adds more).
        verb:
          type: string
          description: The plain verb of the sentence, for example created or published.
          example: created
        recordType:
          type: string
          example: sampleFolder
        recordTypeLabel:
          type: string
          description: Mid-sentence name of the record type at the time.
          example: sample folder
        recordId:
          type: string
        recordName:
          type: string
        path:
          type: array
          description: The record's ancestors at the time, top level first (empty for top-level records).
          items:
            $ref: "#/components/schemas/RecordRef"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"
        comment:
          type: string
          description: A reason the person gave; empty when none.
        details:
          type: string
          description: Plain-text extra information, for example with 2 sample notes; empty when none.
        items:
          type: array
          description: The purged entries of an emptied recycle bin; empty for every other entry.
          items:
            $ref: "#/components/schemas/ActivityLogItem"
        recordNow:
          $ref: "#/components/schemas/RecordNow"
      description: >-
        Extended by later features: items (011), recordNow (011). Properties beyond the required list are always sent by
        the feature that adds them; they stay optional so that earlier answers remain valid (D-191).
    ActivityLogPage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivityLogEntry"
        total:
          type: integer
        unfilteredTotal:
          type: integer
          description: How many entries the whole log holds.
        record:
          description: >-
            The record named by recordId (current name, or its latest name in the log); null without recordId or when
            unknown.
          oneOf:
            - $ref: "#/components/schemas/RecordRef"
            - type: "null"
      description: >-
        Extended by later features: unfilteredTotal (011), record (011). Properties beyond the required list are always
        sent by the feature that adds them; they stay optional so that earlier answers remain valid (D-191).
    ContentCount:
      type: object
      additionalProperties: false
