        draft:
          type: integer
          minimum: 0
        published:
          type: integer
          minimum: 0
        plannedCost:
          description: Sum of the known planned costs; null when no plan has one.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        budget:
          description: Sum of the plan budgets that are set; null when none is set.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
    PlanList:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - summary
        - years
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlanSummary"
        total:
          type: integer
          description: Every plan in the team scope (the "of" of the result count).
        summary:
          $ref: "#/components/schemas/PlanListSummary"
        years:
          type: array
          description: Every year with a plan in the team scope, newest first.
          items:
            type: integer
    PlanDefaults:
      type: object
      additionalProperties: false
      required:
        - currentYear
        - years
        - year
        - teamIds
        - ownerId
        - modelId
        - aop
        - bcpir
        - defaultSpread
        - goalStage
      properties:
        currentYear:
          type: integer
        years:
          type: array
          description: The years a new plan may have (current - 1 to current + 5).
          items:
            type: integer
        year:
          type: integer
        teamIds:
          type: array
          items:
            type: string
        ownerId:
          type:
            - string
            - "null"
        modelId:
          type:
            - string
            - "null"
          description: The only active model; null when there are none or several.
        aop:
          type: boolean
        bcpir:
          type: boolean
        defaultSpread:
          $ref: "#/components/schemas/SpreadMethod"
        goalStage:
          $ref: "#/components/schemas/GoalStage"
    PlanCreate:
      type: object
      additionalProperties: false
