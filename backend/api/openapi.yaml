          type: array
          items:
            $ref: "#/components/schemas/ActivityLogEntry"
        total:
          type: integer
        unfilteredTotal:
          type: integer
          description: How many entries the whole log holds.
        record:
          description: >-
            The record named by recordId (current name, or its latest name in the log); null without recordId or when
            unknown.
          oneOf:
            - $ref: "#/components/schemas/RecordRef"
            - type: "null"
      description: >-
        Extended by later features: unfilteredTotal (011), record (011). Properties beyond the required list are always
        sent by the feature that adds them; they stay optional so that earlier answers remain valid (D-191).
    ContentCount:
      type: object
