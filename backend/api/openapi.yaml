          description: The version the user started editing from.
    SampleNoteCreate:
      type: object
      additionalProperties: false
      required:
        - title
      properties:
        title:
          type: string
    Money:
      type: object
      additionalProperties: false
      description: An exact amount with its currency, as the API answers it. The amount always has two decimals.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]{1,15}\.[0-9]{2}$
          example: "1234.50"
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          example: USD
    MoneyInput:
      type: object
      additionalProperties: false
      description: >-
        An amount sent to the API. The amount is a decimal string with at most two decimals ("12500", "12500.5",
        "12500.50"); the API checks it and answers validation_failed with a message for the field otherwise.
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          example: "12500.00"
        currency:
          type: string
          example: USD
    Percent:
      type: string
      description: A percentage with two decimals, as the API answers it ("2.00" means 2.00 %).
      pattern: ^[0-9]{1,3}\.[0-9]{2}$
      example: "2.00"
    ExchangeRate:
      type: string
      description: Units of a currency per 1 USD, exact to six decimals, without trailing zeros.
      pattern: ^[0-9]{1,7}(\.[0-9]{1,6})?$
      example: "0.92"
    SettingRef:
      type: object
      additionalProperties: false
      description: A Settings record referred to by another one, with its status (inactive ones are labelled "(inactive)").
      required:
        - id
        - name
        - active
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean
    UsagePart:
      type: object
      additionalProperties: false
      required:
        - kind
        - text
        - count
        - inRecycleBin
      properties:
        kind:
          type: string
          enum:
            - plan
            - campaign
            - initiative
            - activity
            - lineItem
            - purchaseRequest
            - purchaseRequestLine
            - person
            - model
            - dependentAttribute
            - condition
            - linkedOption
          description: What uses the record (the purchase request levels since 032).
        text:
          type: string
