      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanChangeEffectsRequest"
      responses:
        "200":
          description: The effects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanChangeEffects"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
