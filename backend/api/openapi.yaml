          example: Digital & social
    RecycleBinRecord:
      type: object
      additionalProperties: false
      description: One record kept in a recycle-bin entry (without its data).
      required:
        - recordType
        - recordTypeLabel
        - recordId
        - recordName
        - parentId
      properties:
        recordType:
          type: string
        recordTypeLabel:
          type: string
        recordId:
          type: string
        recordName:
          type: string
        parentId:
          type: string
          description: The record's parent ID; empty for top-level records.
    RecycleBinListItem:
      type: object
      additionalProperties: false
      description: >-
        A recycle-bin entry as the recycle bin page lists it (001's RecycleBinEntry plus restore state and contents).
        Properties beyond 001's RecycleBinEntry are always sent once feature 011 is built; they stay optional so that
        001's answers remain valid (D-191).
      required:
        - id
        - recordType
        - recordTypeLabel
        - recordId
        - recordName
        - path
        - parent
        - deletedAt
        - deletedBy
        - contents
      properties:
        id:
          type: string
          example: BIN-1001
        recordType:
          type: string
        recordTypeLabel:
          type: string
          example: initiative
        recordTypePlural:
          type: string
          example: initiatives
        recordId:
          type: string
        recordName:
          type: string
        path:
          type: array
          description: Where the record was when it was deleted, top level first.
          items:
            $ref: "#/components/schemas/RecordRef"
        parent:
          description: The record it belonged to when it was deleted (null for top-level records).
          oneOf:
            - $ref: "#/components/schemas/RecordRef"
            - type: "null"
        deletedAt:
          type: string
          format: date-time
        deletedBy:
          $ref: "#/components/schemas/ActorRef"
        contents:
          type: array
          description: What was under it, counted by kind.
          items:
            $ref: "#/components/schemas/ContentCount"
        restoreState:
          type: string
          enum:
            - restorable
            - parentInRecycleBin
            - parentDeletedPermanently
        missingParent:
          description: >-
            The parent that is in the recycle bin, or the record above it that was deleted permanently; null when
            restorable.
          oneOf:
            - $ref: "#/components/schemas/LabelledRef"
            - type: "null"
        parentEntryIds:
          type: array
          description: The entries Restore both / Restore all brings back first, top-most first.
          items:
            type: string
        insideEntryIds:
          type: array
          description: Other entries that can no longer be restored once this one is deleted permanently.
          items:
            type: string
        records:
          type: array
          description: The record first, then everything inside it, parents before children.
          items:
            $ref: "#/components/schemas/RecycleBinRecord"
    RestorePreviewChange:
      type: object
      additionalProperties: false
