    RoleUpdate:
      type: object
      additionalProperties: false
      description: Only the fields to change, and the version (D-203); a field left out keeps its value.
      required: [version]
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          description: The complete list after the change.
          items:
            $ref: "#/components/schemas/PermissionKey"
        defaultScope:
          type: string
          enum: [all, myTeams]
        version:
          type: integer
    RoleAssignment:
      type: object
      additionalProperties: false
      required: [id, role, scope, scopeEmpty]
      properties:
        id:
          type: string
          example: RA-1001
        role:
          $ref: "#/components/schemas/RoleRef"
        scope:
          $ref: "#/components/schemas/AccessScope"
        scopeEmpty:
          type: boolean
          description: true when the scope covers no team (chosen teams all deleted, or myTeams for a person without a team).
    RoleAssignmentInput:
      type: object
      additionalProperties: false
      required: [roleId, scope]
      properties:
        roleId:
          type: string
        scope:
          $ref: "#/components/schemas/AccessScopeInput"
    PersonRoles:
      type: object
      additionalProperties: false
      required: [person, teams, roles, permissions, version]
      properties:
        person:
          $ref: "#/components/schemas/PersonRef"
        teams:
          type: array
          description: The person's teams, active or not, sorted by name.
          items:
            $ref: "#/components/schemas/TeamRef"
        roles:
          type: array
          description: Sorted by role name; empty for a person without a role.
          items:
            $ref: "#/components/schemas/RoleAssignment"
        permissions:
          type: array
          description: >-
            What the roles allow together (merged as authz.Grants does), in Table A order; the web app writes the
            plain-language summary from it (plan, summariseAccess).
          items:
            $ref: "#/components/schemas/MyPermission"
        version:
          type: integer
          minimum: 1
          description: The person's version; send it back with PUT.
    PersonRolesUpdate:
      type: object
      additionalProperties: false
      required: [roles, version]
      properties:
        roles:
          type: array
          description: >-
            The complete list after the change, one entry per role (a role twice answers validation_failed). Field
            problems are keyed roles.<i>.roleId, roles.<i>.scope and roles.<i>.teamIds, i counted from 0.
          items:
            $ref: "#/components/schemas/RoleAssignmentInput"
        version:
          type: integer
          description: The person's version the administrator started from.
    PeopleAccessPage:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonRoles"
        total:
          type: integer
    AccessRules:
      type: object
      additionalProperties: false
      required: [noSelfApproval, newPersonRole, version, updatedAt, updatedBy]
      properties:
        noSelfApproval:
          type: boolean
          description: Nobody approves an activity they own or submitted (FR-026).
        newPersonRole:
          description: The role a person added in Settings › People receives with scope My teams; null for no role.
          oneOf:
            - $ref: "#/components/schemas/RoleRef"
            - type: "null"
        version:
          type: integer
          minimum: 0
          description: 0 while the defaults have never been saved (the first PATCH creates the record).
        updatedAt:
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        updatedBy:
          oneOf:
            - $ref: "#/components/schemas/ActorRef"
            - type: "null"
    AccessRulesUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        noSelfApproval:
          type: boolean
        newPersonRoleId:
          type: string
          description: A role that is not Administrator; "" for no role.
        version:
          type: integer
    MyPermission:
      type: object
      additionalProperties: false
      required: [key, all, teams]
      properties:
        key:
          $ref: "#/components/schemas/PermissionKey"
        all:
          type: boolean
          description: Granted for All markets (always true for permissions that are not scoped).
        teams:
          type: array
          description: The teams it is granted for, when all is false, sorted by name.
          items:
            $ref: "#/components/schemas/TeamRef"
    MyAccess:
      type: object
      additionalProperties: false
      description: >-
        The signed-in person's access, for navigation, page-level gates, the View only note and My profile. Per-record
        decisions come from the records' own access objects, never from this.
      required: [roles, permissions, administrators, noSelfApproval]
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleAssignment"
        permissions:
          type: array
          description: Every permission the person holds, in Table A order; permissions not held are left out.
          items:
            $ref: "#/components/schemas/MyPermission"
        administrators:
          type: array
          description: The active people who hold the Administrator role, sorted by name ("Ask …").
          items:
            $ref: "#/components/schemas/PersonRef"
        noSelfApproval:
          type: boolean
    ActionAvailability:
      type: object
      additionalProperties: false
      description: >-
        Whether the signed-in person may take one action on this record now, and why not. The one availability
        shape of the contract: 008's ApprovalActionAvailability is an alias of it (consolidation D-300). reason is
        empty when available; otherwise the exact message the API would answer, or empty when the screen hides the
        action instead of explaining it (008's approve and decline for people who may not decide, 014 FR-025).
      required: [available, reason]
      properties:
        available:
          type: boolean
        reason:
          type: string
    PlanContentAccess:
      type: object
      additionalProperties: false
      description: What the person may do with the records inside one plan (tree rows, add buttons, row menus).
      required:
        - addCampaign
        - editCampaigns
        - deleteCampaigns
        - addActivity
        - editActivities
        - deleteActivities
        - submitActivities
      properties:
        addCampaign:
          $ref: "#/components/schemas/ActionAvailability"
        editCampaigns:
          $ref: "#/components/schemas/ActionAvailability"
          description: Add initiatives, edit, move and copy campaigns and initiatives.
        deleteCampaigns:
          $ref: "#/components/schemas/ActionAvailability"
        addActivity:
          $ref: "#/components/schemas/ActionAvailability"
        editActivities:
          $ref: "#/components/schemas/ActionAvailability"
          description: Edit, move and copy activities; add, edit and duplicate line items.
        deleteActivities:
          $ref: "#/components/schemas/ActionAvailability"
        submitActivities:
          $ref: "#/components/schemas/ActionAvailability"
    PlanAccess:
      type: object
      additionalProperties: false
      required: [edit, editBudget, delete, publish, copy, content]
      properties:
        edit:
          $ref: "#/components/schemas/ActionAvailability"
        editBudget:
          $ref: "#/components/schemas/ActionAvailability"
          description: Not available for an allocated plan (reason "Allocated from '…' — ask … to change it.").
        delete:
          $ref: "#/components/schemas/ActionAvailability"
        publish:
          $ref: "#/components/schemas/ActionAvailability"
          description: Publish and Unpublish (the plan's own readiness rules still apply).
        copy:
          $ref: "#/components/schemas/ActionAvailability"
        content:
          $ref: "#/components/schemas/PlanContentAccess"
    ContainerAccess:
      type: object
      additionalProperties: false
      description: A campaign's or an initiative's actions; addChild is Add initiative or Add activity.
      required: [edit, delete, move, copy, addChild]
      properties:
        edit:
          $ref: "#/components/schemas/ActionAvailability"
        delete:
          $ref: "#/components/schemas/ActionAvailability"
        move:
          $ref: "#/components/schemas/ActionAvailability"
        copy:
          $ref: "#/components/schemas/ActionAvailability"
        addChild:
          $ref: "#/components/schemas/ActionAvailability"
    ActivityAccess:
      type: object
      additionalProperties: false
      required: [edit, delete, move, copy, addLineItem, editLineItems, deleteLineItems, submit, seeFinance]
      properties:
        edit:
          $ref: "#/components/schemas/ActionAvailability"
        delete:
          $ref: "#/components/schemas/ActionAvailability"
        move:
          $ref: "#/components/schemas/ActionAvailability"
        copy:
          $ref: "#/components/schemas/ActionAvailability"
        addLineItem:
          $ref: "#/components/schemas/ActionAvailability"
        editLineItems:
          $ref: "#/components/schemas/ActionAvailability"
        deleteLineItems:
          $ref: "#/components/schemas/ActionAvailability"
        submit:
          $ref: "#/components/schemas/ActionAvailability"
          description: Permission only; 008's actions.submit adds the activity's own state rules.
        seeFinance:
          $ref: "#/components/schemas/ActionAvailability"
          description: Show the "From finance" section (FR-015).
    LineItemAccess:
      type: object
      additionalProperties: false
      required: [add, edit, delete, duplicate, seeFinance]
      properties:
        add:
          $ref: "#/components/schemas/ActionAvailability"
        edit:
          $ref: "#/components/schemas/ActionAvailability"
        delete:
          $ref: "#/components/schemas/ActionAvailability"
        duplicate:
          $ref: "#/components/schemas/ActionAvailability"
        seeFinance:
          $ref: "#/components/schemas/ActionAvailability"
    BinEntryAccess:
      type: object
      additionalProperties: false
      required: [restore, deletePermanently]
      properties:
        restore:
          $ref: "#/components/schemas/ActionAvailability"
          description: Also Undo and the restore preview.
        deletePermanently:
          $ref: "#/components/schemas/ActionAvailability"
    GlobalBudgetRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          example: GB-1001
        name:
          type: string
          example: FY2026 Global marketing budget
    PlanAllocation:
      type: object
      additionalProperties: false
      description: The allocation that sets a plan's budget (Plan.allocation, FR-031, FR-033).
      required: [allocationId, globalBudget, amount, owner, canOpen]
      properties:
        allocationId:
          type: string
          example: BA-1001
        globalBudget:
          $ref: "#/components/schemas/GlobalBudgetRef"
        amount:
          $ref: "#/components/schemas/Money"
          description: In the plan's currency; equal to the plan budget (D-303).
        owner:
          description: The global budget's owner, whom to ask; null when none.
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        canOpen:
          type: boolean
          description: The viewer holds globalBudgets.view, so the global budget's name is a link.
    AllocationPlanRef:
      type: object
      additionalProperties: false
      required: [id, name, year, status, version]
      properties:
        id:
          type: string
          example: P-1001
        name:
          type: string
        year:
          type: integer
        status:
          $ref: "#/components/schemas/PlanStatus"
        version:
          type: integer
          minimum: 1
          description: Send it as planVersion with allocation changes.
    GlobalBudgetFigures:
      type: object
      additionalProperties: false
      description: >-
        Every figure in USD. Allocations and planned costs kept in a plan's own currency are converted to USD once
        each at the current rate, on read (D-303, D-041).
      required: [amount, allocated, unallocated, plannedCost, overAllocated]
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        allocated:
          $ref: "#/components/schemas/Money"
          description: Sum of every allocation, including those in the Other markets row.
        unallocated:
          $ref: "#/components/schemas/Money"
          description: amount - allocated; negative when over-allocated.
        plannedCost:
          $ref: "#/components/schemas/Money"
          description: Planned cost of every allocated plan (domain model 4.2).
        overAllocated:
          type: boolean
    BudgetAllocationRow:
      type: object
      additionalProperties: false
      required: [id, plan, teams, owner, amount, amountUsd, plannedCost, leftToPlan, budgetUsedPercent, version, access, overspend]
      properties:
        overspend:
          $ref: "#/components/schemas/OverspendMode"
        id:
          type: string
          example: BA-1001
        plan:
          $ref: "#/components/schemas/AllocationPlanRef"
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamRef"
        owner:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        amount:
          $ref: "#/components/schemas/Money"
          description: The allocation in the plan's currency; amount, plannedCost and leftToPlan are in that currency (D-303).
        amountUsd:
          $ref: "#/components/schemas/Money"
          description: The allocation converted to USD at the current rate, as counted in GlobalBudgetFigures.allocated.
        plannedCost:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
          description: null when nothing in the plan has a planned cost (as the plan page).
        leftToPlan:
          $ref: "#/components/schemas/Money"
        budgetUsedPercent:
          description: Planned cost / allocation x 100 with two decimals; null when the allocation is 0.00.
          oneOf:
            - type: string
              example: "62.50"
            - type: "null"
        version:
          type: integer
          minimum: 1
        access:
          type: object
          additionalProperties: false
          required: [edit, remove]
          properties:
            edit:
              $ref: "#/components/schemas/ActionAvailability"
            remove:
              $ref: "#/components/schemas/ActionAvailability"
    OtherMarketsRow:
      type: object
      additionalProperties: false
      description: Allocations to plans the viewer cannot see, added up in USD (FR-033, D-303).
      required: [planCount, amount, plannedCost]
      properties:
        planCount:
          type: integer
          minimum: 1
        amount:
          $ref: "#/components/schemas/Money"
        plannedCost:
          $ref: "#/components/schemas/Money"
    AllocationOption:
      type: object
      additionalProperties: false
      required: [plan, teams, owner, budget, canAllocate, overspend]
      properties:
        overspend:
          $ref: "#/components/schemas/OverspendMode"
        plan:
          $ref: "#/components/schemas/AllocationPlanRef"
        teams:
          type: array
          items:
            $ref: "#/components/schemas/TeamRef"
        owner:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        budget:
          description: The plan's budget now; null when none.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        canAllocate:
          $ref: "#/components/schemas/ActionAvailability"
    AllocationOptionPage:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AllocationOption"
        total:
          type: integer
    GlobalBudget:
      type: object
      additionalProperties: false
      required:
        - overspend
        - id
        - name
        - year
        - amount
        - owner
        - description
        - figures
        - allocations
        - otherMarkets
        - plansWithoutAllocation
        - locks
        - access
        - version
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
      properties:
        overspend:
          $ref: "#/components/schemas/OverspendControl"
        id:
          type: string
          example: GB-1001
        name:
          type: string
        year:
          type: integer
        amount:
          $ref: "#/components/schemas/Money"
        owner:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        description:
          type: string
        figures:
          $ref: "#/components/schemas/GlobalBudgetFigures"
        allocations:
          type: array
          description: Allocations to plans the viewer can see, sorted by plan name.
          items:
            $ref: "#/components/schemas/BudgetAllocationRow"
        otherMarkets:
          oneOf:
            - $ref: "#/components/schemas/OtherMarketsRow"
            - type: "null"
        plansWithoutAllocation:
          type: array
          description: Visible plans of the year without any allocation, sorted by name ("Plans of 2026 without an allocation").
          items:
            $ref: "#/components/schemas/AllocationOption"
        locks:
          type: array
          description: Always the year ("The year can't change once the global budget is saved."); delete while allocated.
          items:
            $ref: "#/components/schemas/Lock"
        access:
          type: object
          additionalProperties: false
          required: [edit, delete, allocate]
          properties:
            edit:
              $ref: "#/components/schemas/ActionAvailability"
            delete:
              $ref: "#/components/schemas/ActionAvailability"
            allocate:
              $ref: "#/components/schemas/ActionAvailability"
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: "#/components/schemas/ActorRef"
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: "#/components/schemas/ActorRef"
    GlobalBudgetSummary:
      type: object
      additionalProperties: false
      required: [id, name, year, owner, figures, allocationCount]
      properties:
        id:
          type: string
        name:
          type: string
        year:
          type: integer
        owner:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
        figures:
          $ref: "#/components/schemas/GlobalBudgetFigures"
        allocationCount:
          type: integer
          description: Every allocation of the global budget.
    GlobalBudgetPage:
      type: object
      additionalProperties: false
      required: [items, total, years, create]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/GlobalBudgetSummary"
        total:
          type: integer
        years:
          type: array
          description: Every year that has a global budget, newest first (the year filter).
          items:
            type: integer
        create:
          $ref: "#/components/schemas/ActionAvailability"
          description: New global budget (needs globalBudgets.manage for All markets).
    GlobalBudgetCreate:
      type: object
      additionalProperties: false
      required: [name, year, amount, ownerId]
      properties:
        overspend:
          description: Warn or Refuse (037); left out keeps the stored setting, or the organisation default on a new record.
          type: string
          enum: [warn, refuse]
        name:
          type: string
        year:
          type: integer
        amount:
          $ref: "#/components/schemas/MoneyInput"
          description: currency must be USD.
        ownerId:
          type: string
        description:
          type: string
    GlobalBudgetUpdate:
      type: object
      additionalProperties: false
      description: Only the fields to change, and the version (D-203). The year cannot change.
      required: [version]
      properties:
        overspend:
          description: Warn or Refuse (037); left out keeps the stored setting, or the organisation default on a new record.
          type: string
          enum: [warn, refuse]
        name:
          type: string
        amount:
          $ref: "#/components/schemas/MoneyInput"
        ownerId:
          type: string
        description:
          type: string
        version:
          type: integer
    BudgetAllocationCreate:
      type: object
      additionalProperties: false
      required: [planId, amount, planVersion]
      properties:
        overspend:
          description: Warn or Refuse (037); left out keeps the stored setting, or the organisation default on a new record.
          type: string
          enum: [warn, refuse]
        planId:
          type: string
        amount:
          $ref: "#/components/schemas/MoneyInput"
          description: >-
            In the plan's currency (016; USD until 016 is built), 0 or more; another currency is a field problem
            "Enter the amount in <code>, the plan's currency." (consolidation D-303).
        planVersion:
          type: integer
          description: The plan's version the person saw; a newer plan answers 409 version_conflict.
    BudgetAllocationUpdate:
      type: object
      additionalProperties: false
      required: [amount, version, planVersion]
      properties:
        overspend:
          description: Warn or Refuse (037); left out keeps the stored setting, or the organisation default on a new record.
          type: string
          enum: [warn, refuse]
        amount:
          $ref: "#/components/schemas/MoneyInput"
          description: In the plan's currency, as BudgetAllocationCreate.amount (D-303).
        version:
          type: integer
          description: The allocation's version.
        planVersion:
          type: integer
          description: The plan's version the person saw.
    # Feature 015 Financial transactions (merged 2026-10-20, D-298)
    FinancialTransactionType:
      type: string
      enum: [purchaseOrder, invoice, payment, accrual]
    FinancialMatchedBy:
      type: string
      description: The rule that linked the transaction (FR-007) or manual (FR-026).
      enum: [lineItemId, trackingKey, poNumber, swbsCode, manual]
    FinancialLinkState:
      type: string
      enum: [linked, lineItemDeleted, notLinked]
    FinancialRecordRef:
      type: object
      additionalProperties: false
      required: [type, id, name]
      properties:
        type:
          $ref: "#/components/schemas/AttributeLevel"
        id:
          type: string
          example: L-1006
        name:
          type: string
          example: Stand build
    FinancialTotals:
      type: object
      additionalProperties: false
      description: Sums in the display currency.
      required: [committed, invoiced, paid, accrued]
      properties:
        committed:
          $ref: "#/components/schemas/Money"
        invoiced:
          $ref: "#/components/schemas/Money"
        paid:
          $ref: "#/components/schemas/Money"
        accrued:
          $ref: "#/components/schemas/Money"
    FinancialFigures:
      type: object
      additionalProperties: false
      description: A record's figures (FR-011, FR-013), display currency.
      required:
        - plannedCost
        - committed
        - invoiced
        - paid
        - accrued
        - notYetCommitted
        - committedPercent
        - committedAbovePlanned
        - lineItemsAbovePlanned
        - firstLineItemAbovePlanned
        - transactionCount
      properties:
        plannedCost:
          description: Null when the record has no planned cost.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        committed:
          $ref: "#/components/schemas/Money"
        invoiced:
          $ref: "#/components/schemas/Money"
        paid:
          $ref: "#/components/schemas/Money"
        accrued:
          $ref: "#/components/schemas/Money"
        notYetCommitted:
          description: Planned cost − committed; negative when committed above planned cost; null without a planned cost.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        committedPercent:
          description: Whole per cent, half up; null without a planned cost or when it is 0.00.
          oneOf:
            - type: integer
            - type: "null"
        committedAbovePlanned:
          type: boolean
        lineItemsAbovePlanned:
          type: integer
          description: Live line items below (activities and containers) committed above their own planned cost; 0 for line items.
        firstLineItemAbovePlanned:
          description: The first of them (by line item ID), for the link; null when none.
          oneOf:
            - $ref: "#/components/schemas/FinancialRecordRef"
            - type: "null"
        transactionCount:
          type: integer
          description: Transactions linked to the record's live line items.
    FinancialSource:
      type: object
      additionalProperties: false
      required: [dataAsOf, feedName, fileName, accrualMonth]
      properties:
        dataAsOf:
          description: When the newest import was made; null when no GSAP data was ever loaded.
          oneOf:
            - type: string
              format: date-time
            - type: "null"
        feedName:
          oneOf:
            - type: string
              example: Demo data (simulated GSAP)
            - type: "null"
        fileName:
          oneOf:
            - type: string
            - type: "null"
        accrualMonth:
          description: The latest accrual month in the data (Accrued counts only it); null when there are no accruals.
          oneOf:
            - type: string
              pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
              example: 2026-09
            - type: "null"
    FinancialBreakdownRow:
      type: object
      additionalProperties: false
      required: [record, figures]
      properties:
        record:
          $ref: "#/components/schemas/FinancialRecordRef"
        figures:
          $ref: "#/components/schemas/FinancialFigures"
    FinancialRecordView:
      type: object
      additionalProperties: false
      required: [record, planId, path, figures, breakdownLevel, breakdown, latest, swbsCodes, source]
      properties:
        record:
          $ref: "#/components/schemas/FinancialRecordRef"
        planId:
          type: string
          example: P-1001
        path:
          type: array
          description: The record's ancestors, plan first; empty for a plan.
          items:
            $ref: "#/components/schemas/FinancialRecordRef"
        figures:
          $ref: "#/components/schemas/FinancialFigures"
        breakdownLevel:
          description: The level of the breakdown rows; null for a line item.
          oneOf:
            - $ref: "#/components/schemas/AttributeLevel"
            - type: "null"
        breakdown:
          type: array
          description: One row per live child, in the order of the plan tree (line items in creation order).
          items:
            $ref: "#/components/schemas/FinancialBreakdownRow"
        latest:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/FinancialTransactionRow"
        swbsCodes:
          type: array
          description: Line items - the distinct SWBS codes on their transactions, sorted; [] otherwise.
          items:
            type: string
        source:
          $ref: "#/components/schemas/FinancialSource"
    FinancialVendor:
      type: object
      additionalProperties: false
      required: [code, name]
      properties:
        code:
          type: string
          example: V-100103
        name:
          type: string
          example: Outdoor Frames Ltd
    FinancialLink:
      type: object
      additionalProperties: false
      required: [state, matchedBy, reason, lineItemId, path, manualBy, manualAt]
      properties:
        state:
