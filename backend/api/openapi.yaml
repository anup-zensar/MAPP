        kind:
          type: string
          enum:
            - plan
            - campaign
            - initiative
            - activity
            - lineItem
            - person
            - model
            - dependentAttribute
            - condition
            - linkedOption
          description: What uses the record.
        text:
          type: string
          description: The part as people read it, for example Used by 12 activities (1 in the recycle bin).
        count:
          type: integer
          minimum: 1
          description: Records using it, those in the recycle bin included.
        inRecycleBin:
          type: integer
          minimum: 0
    Usage:
      type: object
      additionalProperties: false
      description: Where a Settings record is used (FR-003), counting records in the recycle bin.
      required:
        - inUse
        - summary
        - parts
        - records
      properties:
        inUse:
          type: boolean
          description: True when anything uses it; then it cannot be deleted, only set inactive.
        summary:
          type: string
          description: The parts joined with " · ", or Not used yet.
          example: Used by 2 plans
        parts:
          type: array
          items:
            $ref: "#/components/schemas/UsagePart"
        records:
          type: array
          description: >-
            Models and finance budgets only - the plans using it (not in the recycle bin), sorted by name, at most 50.
            Empty otherwise.
          items:
            $ref: "#/components/schemas/RecordRef"
