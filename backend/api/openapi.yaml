    post:
      tags:
        - Approvals
      operationId: submitActivityForApproval
      summary: Submit a Created activity, or re-submit a Declined one (FR-009 – FR-012, FR-020)
      description: |
        Runs the ready-to-submit check again; with problems it changes nothing and answers
        validation_failed listing every problem (field keys as SubmitProblem.field). Otherwise the activity
        becomes Submitted and a new round starts at level 1 with a copy of the workflow's current levels.
