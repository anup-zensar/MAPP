        items:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        total:
          type: integer
    PersonCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - email
      properties:
        name:
          type: string
        email:
          type: string
        jobTitle:
          type: string
          description: Empty when not sent.
        teamIds:
          type: array
