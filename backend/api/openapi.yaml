      additionalProperties: false
      description: Only the fields to change, plus the version the person started editing from.
      required:
        - version
      properties:
        name:
          type: string
        objectType:
          description: Changeable only while the workflow is unused (031 FR-005).
          allOf:
            - $ref: "#/components/schemas/ApprovalSubjectKind"
        description:
          type: string
        levels:
          type: array
          description: >-
            The complete new list of levels, in order; problems as in ApprovalWorkflowCreate ("levels.<n>.…", n from 1,
            D-215).
          items:
            $ref: "#/components/schemas/ApprovalWorkflowLevelInput"
        version:
          type: integer
        reminderDays:
          type: [integer, "null"]
          description: Sent only to change it; null turns reminders off.
        escalationDays:
          description: "017. Optional in the contract; always sent once its feature is built (D-298)."
          type: [integer, "null"]
