openapi: 3.1.0
info:
  title: NorthStar API
  version: 0.2.0
  license:
    name: Proprietary - internal use only
  description: |
    The contract between the NorthStar web app and the NorthStar API (constitution IV).
    This file is the source of truth: the Go contract tests check every request and response against
    it, and the web app's TypeScript types are generated from it.

    Feature 001 adds health, demo sign-in, the current user and preferences, the activity-log and
    recycle-bin core, and the developer sample records. Features 002-012 (the Plan module) add their
    operations; the fragments in specs/0NN-*/contracts/openapi.yaml are merged here (consolidation,
    2026-10-19). Operations that are designed but not yet served are listed in notYetServed in
    backend/internal/app/app_test.go; each feature removes its own when it serves them.

    Conventions (feature 001 research R9 and R10):
    - JSON with camelCase field names. Timestamps are UTC (RFC 3339). Calendar dates are YYYY-MM-DD.
    - Lists answer an object with items and total.
    - Every failure answers the Error object. Messages are written for users.
    - Every update sends the version it started from; an out-of-date version answers 409 version_conflict.
    - Deleting a business record answers the recycle-bin entry so the web app can offer Undo.
    - Money is {"amount": "1234.50", "currency": "USD"} (Money in answers, MoneyInput or decimal strings in requests).
    - Every response has the header Cache-Control no-store.
servers:
  - url: http://127.0.0.1:8080
    description: Local API (development)
security:
  - sessionCookie: []
tags:
  - name: System
    description: Health of the API
  - name: Sign-in
    description: Demo sign-in, only in local and development environments (decision D-004)
  - name: Me
    description: The signed-in person and their preferences
  - name: History
    description: Activity log and recycle bin (the mechanism every feature uses)
  - name: Samples
    description: Developer sample records, only in local and development environments
  - name: Settings
    description: Settings page overview (feature 002)
  - name: Models
    description: Models - the rulebooks plans use (feature 002)
  - name: Activity types
    description: Activity types and their default planned cost (feature 002)
  - name: Shell attributes
    description: Shell attributes, their options, order, import and form definitions (feature 002)
  - name: Currencies
    description: Currencies and exchange rates per 1 USD (feature 002)
  - name: Finance budgets
    description: Finance budgets and finance budget items (feature 002)
  - name: People and teams
    description: People directory, teams and memberships, My profile (feature 003)
  - name: Plans
    description: Plans, the top of the planning hierarchy (feature 004)
  - name: Campaigns
    description: Campaigns and initiatives inside a plan; budgets flow down, costs roll up (feature 005)
  - name: Activities
    description: Activities under initiatives — planned cost, Shell attributes, goals, status and the ready-to-submit check
  - name: Line items
    description: >-
      The costs of an activity — currency, spread over months, finance coding, finance budget link, SWBS request
      (feature 007)
  - name: Approval workflows
    description: Settings › Approval workflows (feature 008)
  - name: Approvals
    description: Submitting, approving, declining and recalling activities; the approvals page (feature 008)
  - name: Notifications
    description: The signed-in person's in-app notifications, shown under the bell (feature 008)
  - name: Home
    description: The home dashboard (read-only figures for the signed-in person)
  - name: All work
    description: The cross-plan grid, calendar and budget views, their export and the person's saved views
  - name: Bulk actions
    description: Change, submit, copy, move or delete many campaigns, initiatives and activities at once
  - name: Imports
    description: Import activities into a plan from a template
paths:
  /api/health:
    get:
      tags:
        - System
      operationId: getHealth
      summary: Check that the API is running
      security: []
      responses:
        "200":
          description: The API is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /api/auth/demo-people:
    get:
      tags:
        - Sign-in
      operationId: getDemoPeople
      summary: List the demo people and the shared demo password for the sign-in page
      description: Only available when demo sign-in is enabled (local and development environments).
      security: []
      responses:
        "200":
          description: >-
            The active demo people, sorted by name, and the demo password. The list is empty when no demo data was
            loaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoPeople"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/auth/sign-in:
    post:
      tags:
        - Sign-in
      operationId: signIn
      summary: Sign in with a demo e-mail and the demo password
      description: |
        The e-mail is compared ignoring letter case and surrounding spaces; the password exactly.
        On success the session cookie is set. Only available when demo sign-in is enabled.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              description: The HttpOnly session cookie northstar_session.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/auth/sign-out:
    post:
      tags:
        - Sign-in
      operationId: signOut
      summary: Sign out (ends the session and clears the cookie)
      description: Always succeeds, also when nobody is signed in.
      security: []
      responses:
        "204":
          description: Signed out.
        default:
          $ref: "#/components/responses/Error"
  /api/me:
    get:
      tags:
        - Me
      operationId: getCurrentUser
      summary: Who is signed in, with their preferences
      responses:
        "200":
          description: The signed-in person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Me
      operationId: updateMyProfile
      summary: Change the signed-in person's name and job title (My profile)
      description: The e-mail is changed only in Settings › People. The change is written to the activity log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: The signed-in person after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/me/preferences:
    patch:
      tags:
        - Me
      operationId: updatePreferences
      summary: Change the signed-in person's preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesUpdate"
      responses:
        "200":
          description: The preferences after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/activity-log:
    get:
      tags:
        - History
      operationId: listActivityLog
      summary: Activity-log entries, newest first, filtered (replaces 001)
      description: |
        Every filter applies to the whole log (FR-003). total counts the matching entries (ignoring
        beforeSeq); unfilteredTotal counts the whole log. Load more passes the seq of the last entry
        received as beforeSeq (FR-009). Each entry says where its record is now (recordNow, FR-008).
      parameters:
        - name: actorId
          in: query
          description: Only entries by this person.
          schema:
            type: string
          example: U-1003
        - name: recordType
          in: query
          description: Only entries about this kind of record, for example activity.
          schema:
            type: string
        - name: action
          in: query
          description: >-
            Only entries with one of these actions. deletedPermanently also matches entries that emptied the recycle
            bin.
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ActivityLogActionFilter"
        - name: planId
          in: query
          description: Only entries about this plan and anything that is or was inside it.
          schema:
            type: string
          example: P-1001
        - name: recordId
          in: query
          description: Only entries about this record (with includeInside, also about everything that is or was below it).
          schema:
            type: string
          example: A-1042
        - name: includeInside
          in: query
          description: With recordId, also entries about the records that are or were below it.
          schema:
            type: boolean
            default: false
        - name: from
          in: query
          description: Only entries at or after this moment (the browser sends local midnight in UTC).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Only entries before this moment (exclusive). Must be after from.
          schema:
            type: string
            format: date-time
        - name: q
          in: query
          description: Search on record name, record ID or the person's name, ignoring letter case.
          schema:
            type: string
        - name: beforeSeq
          in: query
          description: Only entries with a smaller seq (Load more).
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          description: How many entries to return (1 to 200, default 50).
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The newest matching entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityLogPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/recycle-bin:
    get:
      tags:
        - History
      operationId: listRecycleBin
      summary: Everything in the recycle bin, newest first, with restore states and contents (replaces 001)
      responses:
        "200":
          description: The unresolved recycle-bin entries whose record types this API knows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecycleBinPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/recycle-bin/{entryId}/undo:
    post:
      tags:
        - History
      operationId: undoDelete
      summary: Undo a delete (within 2 minutes of the delete)
      description: >-
        Puts back the record and everything that was under it exactly, with the same IDs, versions and statuses. Refused
        with name_taken when someone has meanwhile taken the name; the item then stays in the recycle bin.
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: Restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/recycle-bin/{entryId}/restore:
    post:
      tags:
        - History
      operationId: restoreFromRecycleBin
      summary: Restore a recycle-bin entry, optionally with its parents still in the bin (replaces 001)
      description: |
        Puts back the record and everything under it with the same IDs; plans return as Draft and
        activities as Created, names that are taken get " (restored)", and restored line items send a
        submitted or approved activity back to Created (FR-019 – FR-022). With withParents=true the
        entries holding its missing parents are restored first, in the same step (FR-023). A parent that
        is still in the bin without withParents answers restore_parent_first; a parent deleted
        permanently answers parent_deleted_permanently (FR-024).
      parameters:
        - $ref: "#/components/parameters/EntryId"
        - name: withParents
          in: query
          description: Also restore the entries that hold its missing parents, parents first.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Restored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/sample-folders:
    get:
      tags:
        - Samples
      operationId: listSampleFolders
      summary: All sample folders with their notes, sorted by name, ignoring letter case
      responses:
        "200":
          description: The sample folders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleFolderPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Samples
      operationId: createSampleFolder
      summary: Create a sample folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SampleFolderCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleFolder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/sample-folders/{folderId}:
    patch:
      tags:
        - Samples
      operationId: updateSampleFolder
      summary: Rename a sample folder
      parameters:
        - $ref: "#/components/parameters/FolderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SampleFolderUpdate"
      responses:
        "200":
          description: The folder after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleFolder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Samples
      operationId: deleteSampleFolder
      summary: Delete a sample folder and its notes (they go to the recycle bin)
      parameters:
        - $ref: "#/components/parameters/FolderId"
      responses:
        "200":
          description: Moved to the recycle bin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/sample-folders/{folderId}/notes:
    post:
      tags:
        - Samples
      operationId: createSampleNote
      summary: Add a note to a sample folder
      parameters:
        - $ref: "#/components/parameters/FolderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SampleNoteCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SampleNote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/sample-notes/{noteId}:
    delete:
      tags:
        - Samples
      operationId: deleteSampleNote
      summary: Delete a sample note (it goes to the recycle bin)
      parameters:
        - name: noteId
          in: path
          required: true
          schema:
            type: string
          example: SN-1001
      responses:
        "200":
          description: Moved to the recycle bin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/settings/overview:
    get:
      tags:
        - Settings
      operationId: getSettingsOverview
      summary: Count of active records per Settings section (the Settings page cards)
      responses:
        "200":
          description: Active records per section.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsOverview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/models:
    get:
      tags:
        - Models
      operationId: listModels
      summary: Every model (active and inactive), sorted by name ignoring letter case
      responses:
        "200":
          description: The models with their usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Models
      operationId: createModel
      summary: Create a model (FR-009)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelCreate"
      responses:
        "201":
          description: Created, active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/models/{modelId}:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    get:
      tags:
        - Models
      operationId: getModel
      summary: One model with its usage and the plans using it
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Models
      operationId: updateModel
      summary: Change a model (only the fields sent; FR-009, FR-011, FR-012)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelUpdate"
      responses:
        "200":
          description: The model after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Models
      operationId: deleteModel
      summary: Delete an unused model (it goes to the recycle bin); a model in use answers 409 in_use
      responses:
        "200":
          description: Moved to the recycle bin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/models/{modelId}/impact:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    post:
      tags:
        - Models
      operationId: checkModelImpact
      summary: What a change would affect, before saving it (FR-011, FR-012). Saves nothing.
      description: >-
        Validates the body like PATCH (validation_failed lists every problem) and returns the warnings to confirm. The
        version is not checked here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelUpdate"
      responses:
        "200":
          description: The warnings; an empty list means nothing to confirm.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeImpact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/models/{modelId}/status:
    parameters:
      - $ref: "#/components/parameters/ModelId"
    post:
      tags:
        - Models
      operationId: setModelStatus
      summary: Set a model inactive or reactivate it (FR-004)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: The model with its new status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/activity-types:
    get:
      tags:
        - Activity types
      operationId: listActivityTypes
      summary: Every activity type (active and inactive), sorted by name ignoring letter case
      responses:
        "200":
          description: The activity types with their models and usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityTypePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Activity types
      operationId: createActivityType
      summary: Create an activity type, optionally allowed in models (FR-013)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityTypeCreate"
      responses:
        "201":
          description: Created, active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/activity-types/{activityTypeId}:
    parameters:
      - $ref: "#/components/parameters/ActivityTypeId"
    get:
      tags:
        - Activity types
      operationId: getActivityType
      summary: One activity type with its models and usage
      responses:
        "200":
          description: The activity type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityType"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Activity types
      operationId: updateActivityType
      summary: Change an activity type and the models allowing it (FR-012, FR-013)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityTypeUpdate"
      responses:
        "200":
          description: The activity type after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Activity types
      operationId: deleteActivityType
      summary: Delete an unused activity type (not used by activities and not allowed in any model)
      responses:
        "200":
          description: Moved to the recycle bin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
