    get:
      tags:
        - Plans
      operationId: getPlan
      summary: One plan with its calculated figures, goals and completeness
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Plans
      operationId: updatePlan
      summary: Save the plan form (every editable field, plus the version it started from)
      description: |
        The year never changes. A Published plan stays Published. Only changed fields are saved and logged;
        a save without any change creates no version and no log entry.
      parameters:
        - $ref: "#/components/parameters/PlanId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanUpdate"
      responses:
        "200":
          description: The plan after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Plans
      operationId: deletePlan
      summary: Delete a plan and everything in it (they go to the recycle bin)
      parameters:
        - $ref: "#/components/parameters/PlanId"
      responses:
        "200":
          description: Moved to the recycle bin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
