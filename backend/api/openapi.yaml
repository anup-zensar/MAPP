      tags:
        - Plans
      operationId: getPlanDefaults
      summary: The default values of a new plan for the signed-in person
      description: |
        Year = the current year; years = current year - 1 to + 5; teams = the person's active teams;
        owner = the person when they have one; model = the only active model.
      responses:
        "200":
          description: The defaults.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanDefaults"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/plans:
    get:
      tags:
        - Plans
      operationId: listPlans
      summary: Plans matching the filters, newest year first, then by name
      description: |
        total counts every plan in the team scope; summary covers the plans in the team scope and the chosen
        year (status and search ignored); years lists every year with a plan in the team scope.
        Amounts are in the signed-in person's display currency.
      parameters:
        - name: scope
          in: query
          description: all (default) or myTeams (plans with one of the signed-in person's teams).
          schema:
            type: string
            enum:
              - all
              - myTeams
            default: all
        - name: status
          in: query
          description: Only plans with this status; every status when not sent.
          schema:
            $ref: "#/components/schemas/PlanStatus"
        - name: year
          in: query
          description: Only plans of this year; every year when not sent.
          schema:
            type: integer
          example: 2026
        - name: q
          in: query
          description: Part of the name or of the ID, ignoring letter case and surrounding spaces.
          schema:
            type: string
      responses:
        "200":
          description: The matching plans and the summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Plans
      operationId: createPlan
      summary: Create a plan (it starts as Draft)
      description: Only name, year and model are required to save; every problem is reported at once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanCreate"
      responses:
        "201":
