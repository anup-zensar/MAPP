      tags: [Financials]
      operationId: listFinancialTransactions
      summary: One page of transactions for a filter set, with counts per tab and totals
      description: |
        counts are per tab for every filter except type and link (the "Not linked" tab counts link =
        notLinked). totals cover every filter except type. A refused parameter answers 400
        validation_failed with FieldError.field set to the parameter's name.
      parameters:
        - $ref: "#/components/parameters/FinancialType"
        - $ref: "#/components/parameters/FinancialSearch"
        - $ref: "#/components/parameters/FinancialYear"
        - $ref: "#/components/parameters/FinancialPlan"
        - $ref: "#/components/parameters/FinancialRecordFilter"
        - $ref: "#/components/parameters/FinancialLinkFilter"
        - $ref: "#/components/parameters/FinancialSort"
        - $ref: "#/components/parameters/FinancialPageNumber"
        - $ref: "#/components/parameters/FinancialPageSize"
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialTransactionPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/financials/transactions/{transactionId}:
    get:
      tags: [Financials]
      operationId: getFinancialTransaction
      summary: One transaction with every field, its link and its import
      parameters:
        - $ref: "#/components/parameters/FinancialTransactionId"
      responses:
        "200":
          description: The transaction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialTransaction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/financials/transactions/{transactionId}/link:
    post:
      tags: [Financials]
      operationId: linkFinancialTransaction
      summary: Link a not-linked transaction to a line item by hand (FR-026)
      description: |
        Only for transactions whose link state is notLinked. A rule-based link answers 409 not_allowed
        ("Linked by GSAP data (HX key HX1006) — correct it in GSAP."). A missing line item, or one in
        the recycle bin, answers 400 validation_failed on lineItemId. Logged (verb "linked").
      parameters:
        - $ref: "#/components/parameters/FinancialTransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinancialLinkRequest"
      responses:
        "200":
          description: The transaction after linking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialTransaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/financials/transactions/{transactionId}/unlink:
    post:
      tags: [Financials]
      operationId: unlinkFinancialTransaction
      summary: Undo a manual link (FR-026)
      description: |
        Only when matchedBy is manual; otherwise 409 not_allowed ("Only links made by a person can be
        undone here."). The transaction is matched again by the rules and usually becomes notLinked
        with its reason. Logged (verb "unlinked").
      parameters:
        - $ref: "#/components/parameters/FinancialTransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinancialUnlinkRequest"
      responses:
        "200":
          description: The transaction after unlinking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialTransaction"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/financials/overview:
    get:
      tags: [Financials]
      operationId: getFinancialOverview
      summary: Home's Financials card for the current year and the Home scope (FR-025)
      parameters:
        - $ref: "#/components/parameters/HomeScope"
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialOverview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/financials/imports:
    get:
      tags: [Financials]
      operationId: listFinancialImports
      summary: Every GSAP import, newest first (FR-008)
      responses:
        "200":
          description: The imports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialImportPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Financials]
      operationId: createFinancialImport
      summary: Import a simulated GSAP extract (FR-004 – FR-007)
      description: |
        Applies the valid rows (refused rows are skipped and listed), links every row by the rules,
        retries every stored not-linked transaction, stores one import record and writes one
        activity-log entry. A problem with the whole file answers 400 validation_failed on content
        (or fileName) and saves nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinancialImportRequest"
      responses:
        "201":
          description: The import result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialImportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/financials/imports/check:
    post:
      tags: [Financials]
      operationId: checkFinancialImport
      summary: Check a simulated GSAP extract without saving anything
      description: |
        Runs exactly what the import would do and discards it. Lists at most 200 problems and 200
        not-linked rows; the totals say how many there are.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinancialImportRequest"
      responses:
        "200":
          description: What the import would do.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialImportCheck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/financials/imports/template:
    get:
      tags: [Financials]
      operationId: getFinancialImportTemplate
      summary: The sample GSAP extract file (header and three example rows, FR-009)
      responses:
        "200":
          description: The file, named spa-one-gsap-extract-sample.csv in Content-Disposition.
          headers:
            Content-Disposition:
              description: attachment with filename.
              schema:
                type: string
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  # Feature 030 SWBS codes from a simulated GSAP
  /api/v1/simulated-gsap/swbs-runs:
    get:
      tags: [Simulated GSAP]
      operationId: listSwbsRuns
      summary: The runs of the simulated GSAP, newest first, and how many line items are ready to send (030 FR-011)
      parameters:
        - name: limit
          in: query
          required: false
          description: At most this many runs (1–100, default 20).
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwbsRunPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Simulated GSAP]
      operationId: createSwbsRun
      summary: Send the line items that are ready to the simulated GSAP and store the codes it returns (030 FR-006 – FR-010)
      description: |
        Sends every line item whose SWBS status is readyToSend within the person's finance.import scope, or
        only lineItemIds, to the simulated GSAP, which answers each with SIM-<company code|0000>-<nnnn>. The
        line items store their codes, one run is kept and one activity-log entry written. A named line item
        that does not exist or is out of scope answers 404 not_found; one that is not ready answers 409
        not_allowed and nothing is sent. A run with nothing ready is kept with no codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SwbsRunRequest"
      responses:
        "201":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwbsRun"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  # Feature 016 Planning and currency extensions (merged 2026-10-20, D-298)
  /api/v1/purchase-requests:
    get:
      tags: [Purchase requests]
      operationId: listPurchaseRequests
      summary: The Purchase requests page — PRs grouped by vendor, with their lines (FR-044 – FR-048)
      description: |
        PRs of the plans where the person holds purchaseRequests.list, ordered by vendor (case-insensitive;
        an empty vendor last as "Not completed"), then by the sort. Each row carries its lines and their line
        items. vendors gives each vendor on the page its number of matching PRs and totals over all matching
        PRs (not only this page). Search matches PR ID, name, vendor, GSAP PR number, and the HX keys and PO
        numbers of the lines. 409 not_allowed while Purchase Support is off.
      parameters:
        - $ref: "#/components/parameters/PurchaseRequestSearch"
        - $ref: "#/components/parameters/PurchaseRequestStatusFilter"
        - $ref: "#/components/parameters/PurchaseRequestTypeFilter"
        - $ref: "#/components/parameters/PurchaseRequestTypeNotCompleted"
        - $ref: "#/components/parameters/PurchaseRequestVendorFilter"
        - $ref: "#/components/parameters/PurchaseRequestVendorNotCompleted"
        - $ref: "#/components/parameters/PurchaseRequestOwnerFilter"
        - $ref: "#/components/parameters/PurchaseRequestCreatedFrom"
        - $ref: "#/components/parameters/PurchaseRequestCreatedTo"
        - $ref: "#/components/parameters/PurchaseRequestWaitingForGsap"
        - $ref: "#/components/parameters/PurchaseRequestSort"
        - $ref: "#/components/parameters/PurchaseRequestPageNumber"
        - $ref: "#/components/parameters/PurchaseRequestPageSize"
      responses:
