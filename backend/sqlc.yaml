version: "2"
sql:
  - engine: postgresql
    schema: internal/platform/database/migrations
    queries: internal/platform/database/queries
    gen:
      go:
        package: sqlcdb
        out: internal/platform/database/sqlcdb
        sql_package: pgx/v5
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: date
            go_type: time.Time
          - db_type: date
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: pg_catalog.int4
            go_type: int
          - db_type: pg_catalog.int4
            nullable: true
            go_type:
              type: int
              pointer: true
          - db_type: pg_catalog.int8
            nullable: true
            go_type:
              type: int64
              pointer: true
          - db_type: text
            nullable: true
            go_type:
              type: string
              pointer: true
