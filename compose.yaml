# Optional (constitution, Current Phase & Scope): nothing here is needed to develop MAPP natively.
#   docker compose up -d postgres          PostgreSQL only, for developers who prefer it to a native install
#   docker compose up -d --build           the whole app, built from this checkout, at http://127.0.0.1:3000
# Works the same with `podman compose`. Local only: every port is published on 127.0.0.1, and PostgreSQL
# trusts local connections, so it holds no password. `docker compose down -v` deletes all the data.
name: mapp
services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: mapp
      POSTGRES_DB: mapp
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  seed:
    build: ./backend
    image: mapp-api:local
    entrypoint: ["/usr/local/bin/seed", "-if-empty"]
    environment:
      DATABASE_URL: postgres://mapp@postgres:5432/mapp?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    image: mapp-api:local
    environment:
      DATABASE_URL: postgres://mapp@postgres:5432/mapp?sslmode=disable
      TRUSTED_PROXIES: 172.16.0.0/12
    depends_on:
      seed:
        condition: service_completed_successfully

  web:
    build: ./frontend
    image: mapp-web:local
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      - api

volumes:
  postgres-data:
