      required:
        - key
        - label
        - activities
        - lineItems
        - plannedCost
        - share
        - budget
        - budgetUsedPercent
        - overBudget
      properties:
        key:
          type: string
          description: Option id, built-in id, notFilledIn or notOnLineItem.
        label:
          type: string
        activities:
          type: integer
          minimum: 0
        lineItems:
          type: integer
          minimum: 0
        plannedCost:
          $ref: "#/components/schemas/Money"
        share:
          type: string
          description: Share of the total planned cost, two decimals ("37.50"); may exceed 100.00 when activities count in several groups.
          pattern: ^-?[0-9]{1,5}\.[0-9]{2}$
        budget:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        budgetUsedPercent:
          type: [integer, "null"]
        overBudget:
