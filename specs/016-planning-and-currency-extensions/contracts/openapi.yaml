openapi: 3.1.0
info:
  title: MAPP API — feature 016 Planning and currency extensions (fragment)
  version: 0.1.0
  license:
    name: Proprietary - internal use only
  description: |
    FRAGMENT. The paths, parameters and schemas feature 016 adds, and under x-amendments the changes to
    operations and schemas of 002–010 already in backend/api/openapi.yaml. The consolidation step merges
    both (tasks.md T001); every $ref is written as it reads in the merged file.

    Reused from the merged contract: responses BadRequest, Unauthorized, NotFound, Conflict, Error;
    schemas Money, MoneyInput, ExchangeRate, Percent, ActorRef, RecordRef, FieldError, ChangeImpact,
    DeleteResult, MissingField, ActivityStatus, ActivityDestination, Activity, Plan, Campaign, Initiative,
    PlanFigures, AllWorkPeriod, AllWorkSummary; parameters CurrencyCode, PlanId, CampaignId, InitiativeId,
    ActivityId and the AllWork* query parameters.

    Conventions as 001–010: camelCase; dates YYYY-MM-DD; timestamps UTC; amounts the API answers are Money
    objects; amounts a client sends are decimal strings with at most two decimals (D-190); rates are decimal
    strings with at most six decimals; problems answer 400 validation_failed with every FieldError at once;
    updates send the version they started from (409 version_conflict otherwise). No new error code (016-P).
tags:
  - name: Exchange rates
    description: Dated exchange rates and the simulated GSAP rate import (feature 016)
  - name: Field help
    description: Help texts of built-in fields, maintained in Settings (feature 016)
  - name: Budget phasing
    description: Budget by month of plans, campaigns and initiatives (feature 016)
  - name: Split activity
    description: Splitting one activity into two (feature 016)

paths:
  /api/currencies/{code}/rates:
    parameters:
      - $ref: "#/components/parameters/CurrencyCode"
    get:
      tags: [Exchange rates]
      operationId: listCurrencyRates
      summary: A currency's rate history, newest first, and its current rate
      responses:
        "200":
          description: The history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRatePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Exchange rates]
      operationId: addCurrencyRate
      summary: Add a dated rate (source manual). USD answers validation_failed on code ("USD is always 1.").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateCreate"
      responses:
        "201":
          description: The rate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRateRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/currencies/{code}/rates/impact:
    parameters:
      - $ref: "#/components/parameters/CurrencyCode"
    post:
      tags: [Exchange rates]
      operationId: checkCurrencyRateImpact
      summary: What adding this rate would change (saves nothing, D-044)
      description: |
        Validates like addCurrencyRate. When the rate would become the current rate, answers the line-item
        warning of 002 and an amountsRecalculated warning for the plans planned in the currency (016 FR-005);
        a future-dated rate answers no warning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateCreate"
      responses:
        "200":
          description: The warnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeImpact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/exchange-rates/{rateId}:
    parameters:
      - $ref: "#/components/parameters/RateId"
    patch:
      tags: [Exchange rates]
      operationId: updateExchangeRate
      summary: Change a rate's value (its date never changes); the rate becomes source manual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateUpdate"
      responses:
        "200":
          description: The rate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExchangeRateRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Exchange rates]
      operationId: deleteExchangeRate
      summary: Move a rate to the recycle bin
      description: |
        Refused with validation_failed on id when it is the currency's last rate dated today or earlier
        ("EUR needs a rate dated today or earlier.").
      responses:
        "200":
          description: Deleted; Undo through the recycle bin entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/exchange-rates/{rateId}/impact:
    parameters:
      - $ref: "#/components/parameters/RateId"
    post:
      tags: [Exchange rates]
      operationId: checkExchangeRateImpact
      summary: What changing this rate would change (saves nothing)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeRateUpdate"
      responses:
        "200":
          description: The warnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeImpact"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/exchange-rates/current:
    get:
      tags: [Exchange rates]
      operationId: listCurrentRates
      summary: Every currency's current rate with its date and source (the "rate used" of FR-009)
      responses:
        "200":
          description: The current rates; USD first, then by code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentRatePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/exchange-rates/import-check:
    post:
      tags: [Exchange rates]
      operationId: checkRateImport
      summary: Review a GSAP daily rate file (simulated feed); saves nothing
      description: |
        Every row's outcome (data-model §2.4). An unreadable file (missing column, not CSV, above 2 MB or
        20,000 rows) answers validation_failed on content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateImportUpload"
      responses:
        "200":
          description: The review.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateImportCheck"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/exchange-rates/import:
    post:
      tags: [Exchange rates]
      operationId: importRates
      summary: Import the rows to add and replace of a GSAP daily rate file, in one step
      description: |
        Re-reads the file with the same rules as import-check. Nothing to add or replace answers
        validation_failed on content ("Nothing to import: every rate is already present or not used.").
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateImportUpload"
      responses:
        "201":
          description: The import record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateImport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/exchange-rates/imports:
    get:
      tags: [Exchange rates]
      operationId: listRateImports
      summary: The latest rate imports, newest first
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: The imports.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateImportPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/exchange-rates/import-sample:
    get:
      tags: [Exchange rates]
      operationId: getRateImportSample
      summary: A sample GSAP daily rate file with today's rates of the active currencies (+0.5 %)
      responses:
        "200":
          description: The file, named gsap_rates_<today>.csv in Content-Disposition.
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/field-help:
    get:
      tags: [Field help]
      operationId: listFieldHelp
      summary: Every help entry of the catalogue, with its text (edited or default)
      responses:
        "200":
          description: The entries in catalogue order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldHelpPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"
  /api/field-help/{helpKey}:
    parameters:
      - $ref: "#/components/parameters/HelpKey"
    patch:
      tags: [Field help]
      operationId: updateFieldHelp
      summary: Edit a help text, or reset it to the default with text null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldHelpUpdate"
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldHelpEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/plans/{planId}/budget-phasing:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    put:
      tags: [Budget phasing]
      operationId: setPlanBudgetPhasing
      summary: Set the plan budget's phasing (any plan status; logged)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetPhasingUpdate"
      responses:
        "200":
          description: The plan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/campaigns/{campaignId}/budget-phasing:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
    put:
      tags: [Budget phasing]
      operationId: setCampaignBudgetPhasing
      summary: Set the campaign budget's phasing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetPhasingUpdate"
      responses:
        "200":
          description: The campaign.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/initiatives/{initiativeId}/budget-phasing:
    parameters:
      - $ref: "#/components/parameters/InitiativeId"
    put:
      tags: [Budget phasing]
      operationId: setInitiativeBudgetPhasing
      summary: Set the initiative budget's phasing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetPhasingUpdate"
      responses:
        "200":
          description: The initiative.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Initiative"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/plans/{planId}/budget-by-month:
    parameters:
      - $ref: "#/components/parameters/PlanId"
    get:
      tags: [Budget phasing]
      operationId: getPlanBudgetByMonth
      summary: Phased budget against planned cost by month and quarter, for the plan and every campaign and initiative
      responses:
        "200":
          description: In the plan currency (data-model §3.4).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetByMonth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/activities/{activityId}/split-options:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    get:
      tags: [Split activity]
      operationId: getActivitySplitOptions
      summary: What the Split dialog offers
      responses:
        "200":
          description: The options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivitySplitOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/activities/{activityId}/split-preview:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    post:
      tags: [Split activity]
      operationId: previewActivitySplit
      summary: Both activities as a split would leave them (saves nothing)
      description: Problems are answered in the body (200) so the dialog can show them while typing; sides are null when they cannot be worked out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivitySplitRequest"
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivitySplitPreview"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /api/activities/{activityId}/split:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    post:
      tags: [Split activity]
      operationId: splitActivity
      summary: Split the activity, all or nothing (data-model §3.6)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivitySplitRequest"
      responses:
        "201":
          description: The original and the new activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivitySplitResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /api/all-work/breakdown:
    get:
      tags:
        - All work
      operationId: getAllWorkBreakdown
      summary: The Breakdown view (and the plan page's Planned cost by card) for a filter set
      description: |
        Takes every filter parameter of getAllWork. With amountsIn=plan and exactly one plan filtered, amounts
        are in that plan's currency; otherwise in the display currency (amountsIn=plan with several plans
        answers validation_failed on amountsIn).
      parameters:
        - $ref: "#/components/parameters/AllWorkYear"
        - $ref: "#/components/parameters/AllWorkYearFrom"
        - $ref: "#/components/parameters/AllWorkYearTo"
        - $ref: "#/components/parameters/AllWorkPlan"
        - $ref: "#/components/parameters/AllWorkPlanStatus"
        - $ref: "#/components/parameters/AllWorkContainerStatus"
        - $ref: "#/components/parameters/AllWorkActivityStatus"
        - $ref: "#/components/parameters/AllWorkOwner"
        - $ref: "#/components/parameters/AllWorkTeam"
        - $ref: "#/components/parameters/AllWorkBusinessUnit"
        - $ref: "#/components/parameters/AllWorkActivityType"
        - $ref: "#/components/parameters/AllWorkStrategic"
        - $ref: "#/components/parameters/AllWorkPlanType"
        - $ref: "#/components/parameters/AllWorkPlanCurrency"
        - $ref: "#/components/parameters/AllWorkAttr"
        - $ref: "#/components/parameters/AllWorkShowLevels"
        - $ref: "#/components/parameters/AllWorkSearch"
        - $ref: "#/components/parameters/AllWorkBy"
        - $ref: "#/components/parameters/AllWorkThenBy"
        - $ref: "#/components/parameters/AllWorkAmountsIn"
      responses:
        "200":
          description: The groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllWorkBreakdown"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        default:
          $ref: "#/components/responses/Error"

components:
  parameters:
    RateId:
      name: rateId
      in: path
      required: true
      schema:
        type: string
      example: XR-1001
    HelpKey:
      name: helpKey
      in: path
      required: true
      description: A key of the Field help catalogue (data-model §6).
      schema:
        type: string
        pattern: ^[a-zA-Z]+\.[a-zA-Z]+$
      example: plan.budget
    PlansYearFrom:
      name: yearFrom
      in: query
      description: First year of the range (inclusive). With yearTo; year is an alias for yearFrom = yearTo.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    PlansYearTo:
      name: yearTo
      in: query
      description: Last year of the range (inclusive); not before yearFrom.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    PlansType:
      name: type
      in: query
      description: Only plans of these types (repeat the parameter); every type when not sent.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/PlanType"
      style: form
      explode: true
    AllWorkYearFrom:
      name: yearFrom
      in: query
      description: First year of the range; default the current year. year is an alias for yearFrom = yearTo.
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    AllWorkYearTo:
      name: yearTo
      in: query
      description: Last year of the range; default yearFrom; at most yearFrom + 4 ("Choose at most 5 years.").
      schema:
        type: integer
        minimum: 2000
        maximum: 2100
    AllWorkPlanType:
      name: planType
      in: query
      description: Plans of these types (tested on plans).
      schema:
        type: array
        items:
          $ref: "#/components/schemas/PlanType"
      style: form
      explode: true
    AllWorkPlanCurrency:
      name: planCurrency
      in: query
      description: Plans planned in these currencies (tested on plans).
      schema:
        type: array
        items:
          type: string
          pattern: ^[A-Z]{3}$
      style: form
      explode: true
    AllWorkAttr:
      name: attr
      in: query
      description: |
        A Shell-attribute filter, repeatable: <attributeId>:<value>,<value>… where a value is an option id,
        yes, no, or none (Not filled in). Tested on the attribute's level (016 FR-039).
      schema:
        type: array
        items:
          type: string
          pattern: "^[A-Z]+-[0-9]+:[A-Za-z0-9,-]+$"
      style: form
      explode: true
      example: ["SA-1022:SO-1301,none"]
    AllWorkComparePhased:
      name: comparePhased
      in: query
      description: Budget & cost only - add phasedBudget and overPeriods to plan, campaign and initiative rows.
      schema:
        type: boolean
        default: false
    AllWorkBy:
      name: by
      in: query
      description: >-
        The grouping - attr:<attributeId>, plan, planType, planCurrency, year, team, businessUnit, activityType or
        owner. Needed by GET /api/all-work/breakdown and by the Breakdown export (view=breakdown): missing there, it
        answers 400 validation_failed on by. Optional in the contract so the other exports need not send it (D-298).
      schema:
        type: string
      example: attr:SA-1013
    AllWorkThenBy:
      name: thenBy
      in: query
      description: An optional second grouping, different from by.
      schema:
        type: string
    AllWorkAmountsIn:
      name: amountsIn
      in: query
      description: display (default) or plan (one plan filtered - its plan currency).
      schema:
        type: string
        enum:
          - display
          - plan
        default: display

  schemas:
    RateSource:
      type: string
      enum:
        - manual
        - gsapImport
      description: Entered by hand, or written by a GSAP rate import.
    RateUsed:
      type: object
      additionalProperties: false
      description: A currency's current rate and where it came from (016 FR-009).
      required:
        - currency
        - rate
        - inverseRate
        - rateDate
        - source
        - importFileName
      properties:
        currency:
          type: string
          example: GBP
        rate:
          $ref: "#/components/schemas/ExchangeRate"
        inverseRate:
          $ref: "#/components/schemas/ExchangeRate"
        rateDate:
          type: [string, "null"]
          format: date
          description: Null for USD.
        source:
          oneOf:
            - $ref: "#/components/schemas/RateSource"
            - type: "null"
        importFileName:
          type: [string, "null"]
    CurrentRatePage:
      type: object
      additionalProperties: false
      required:
        - today
        - items
        - total
      properties:
        today:
          type: string
          format: date
          description: The API's date the current rates are worked out for.
        items:
          type: array
          items:
            $ref: "#/components/schemas/RateUsed"
        total:
          type: integer
    ExchangeRateRecord:
      type: object
      additionalProperties: false
      description: >-
        One dated rate of a currency (data-model §2.1). Named ExchangeRateRecord because ExchangeRate (002) is the
        rate string itself.
      required:
        - id
        - currency
        - date
        - rate
        - inverseRate
        - source
        - importId
        - importFileName
        - current
        - future
        - version
        - createdAt
        - createdBy
        - updatedAt
        - updatedBy
      properties:
        id:
          type: string
          example: XR-1001
        currency:
          type: string
          example: EUR
        date:
          type: string
          format: date
        rate:
          $ref: "#/components/schemas/ExchangeRate"
        inverseRate:
          $ref: "#/components/schemas/ExchangeRate"
        source:
          $ref: "#/components/schemas/RateSource"
        importId:
          type: [string, "null"]
        importFileName:
          type: [string, "null"]
        current:
          type: boolean
          description: The rate conversions use today.
        future:
          type: boolean
          description: Dated after today ("From <date>").
        version:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: "#/components/schemas/ActorRef"
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: "#/components/schemas/ActorRef"
    ExchangeRatePage:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - current
      properties:
        items:
          type: array
          description: Newest date first.
          items:
            $ref: "#/components/schemas/ExchangeRateRecord"
        total:
          type: integer
        current:
          $ref: "#/components/schemas/RateUsed"
    ExchangeRateCreate:
      type: object
      additionalProperties: false
      required:
        - date
        - rate
      properties:
        date:
          type: string
          description: YYYY-MM-DD; checked by the server.
        rate:
          type: string
