        notes:
          type: array
          description: Sentences to show under the table (data-model §3.5).
          items:
            type: string
        groupings:
          type: array
          description: Every grouping the pickers offer.
          items:
            $ref: "#/components/schemas/AllWorkGrouping"

x-amendments:
  description: |
    Changes to existing operations and schemas of backend/api/openapi.yaml. "addProperties" are added to
    properties and, unless listed under optional, to required. "describe" replaces a property's description.
  operations:
    listPlans:
      addParameters: [PlansYearFrom, PlansYearTo, PlansType]
      note: year stays as an alias for yearFrom = yearTo; summary covers the range; years unchanged.
    getAllWork:
      addParameters: [AllWorkYearFrom, AllWorkYearTo, AllWorkPlanType, AllWorkPlanCurrency, AllWorkAttr, AllWorkComparePhased]
      note: AllWorkView adds breakdown (answered by getAllWorkBreakdown; getAllWork refuses it with validation_failed on view); AllWorkPeriod adds year.
    exportAllWork:
      addParameters: [AllWorkYearFrom, AllWorkYearTo, AllWorkPlanType, AllWorkPlanCurrency, AllWorkAttr, AllWorkComparePhased, AllWorkBy, AllWorkThenBy]
      note: view=breakdown exports the group table (by required then); About this export lists the range, filters, breakdown and rates used.
    getAllWorkOptions:
      addParameters: [AllWorkYearFrom, AllWorkYearTo]
  parameters:
    AllWorkView:
      addEnum: [breakdown]
    AllWorkPeriod:
      addEnum: [year]
  schemas:
    Currency:
      addProperties:
        rateDate:
          type: string
          format: date
          description: The date of the current rate.
        rateSource:
          $ref: "#/components/schemas/RateSource"
        rateImportFileName:
          type: [string, "null"]
      describe:
        rate: The current rate (016 FR-002).
        rateChangedAt: When the current rate was recorded.
    CurrencyCreate:
      describe:
        rate: Units per 1 USD; becomes the currency's first rate, dated today.
    CurrencyUpdate:
      describe:
        rate: Sets today's rate (adds or replaces today's row, source manual).
    LineItemCurrency:
      addProperties:
        rateDate:
          type: [string, "null"]
          format: date
        rateSource:
          oneOf:
            - $ref: "#/components/schemas/RateSource"
            - type: "null"
    PlanDefaults:
      addProperties:
        currency:
          type: string
          example: USD
        planType:
          $ref: "#/components/schemas/PlanType"
    PlanCreate:
      addProperties:
        currency:
          type: string
          description: The plan currency, an active currency code.
        planType:
          $ref: "#/components/schemas/PlanType"
      describe:
        budget: In the plan currency (its currency must equal currency); null for no budget.
    PlanUpdate:
      addProperties:
        currency:
          type: string
        planType:
          $ref: "#/components/schemas/PlanType"
    Plan:
      addProperties:
        currency:
          type: string
        planType:
          $ref: "#/components/schemas/PlanType"
        budgetPhasing:
          $ref: "#/components/schemas/BudgetPhasing"
        planFigures:
          description: The figures in the plan currency (figures stays in the display currency).
          $ref: "#/components/schemas/PlanFigures"
        currencyLock:
          type: [string, "null"]
          description: >-
            Why the plan currency can't change (016 FR-012, and while the plan has a global-budget allocation,
            consolidation D-303); null when it can.
      describe:
        budget: In the plan currency.
    PlanSummary:
      addProperties:
        planType:
          $ref: "#/components/schemas/PlanType"
        currency:
          type: string
        planBudget:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
        planPlannedCost:
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
    Campaign:
      addProperties:
        budgetPhasing:
          $ref: "#/components/schemas/BudgetPhasing"
      describe:
        budget: In the plan currency.
        budgetAndCost: In the plan currency; display holds the display-currency amounts.
    Initiative:
      addProperties:
        budgetPhasing:
          $ref: "#/components/schemas/BudgetPhasing"
      describe:
        budget: In the plan currency.
        budgetAndCost: In the plan currency; display holds the display-currency amounts.
    CampaignCreate:
      describe:
        budget: In the plan currency; at most 2 decimals; not negative.
    CampaignUpdate:
      describe:
        budget: In the plan currency.
    InitiativeCreate:
      describe:
        budget: In the plan currency.
    InitiativeUpdate:
      describe:
        budget: In the plan currency.
    BudgetAndCost:
      describe:
        description: In the record's plan currency as budgetAndCost, and in the display currency inside display.
    ContainerDisplay:
      describe:
        description: The amounts in the reader's display currency, each converted once from the plan currency (016-D).
    PlanCampaignTotals:
      describe:
        description: In the plan currency as totals and in the display currency as displayTotals.
    Activity:
      addProperties:
        splitFrom:
          oneOf:
            - $ref: "#/components/schemas/SplitLink"
            - type: "null"
        splitInto:
          type: array
          items:
            $ref: "#/components/schemas/SplitLink"
      describe:
        plannedCost: In the plan currency.
        unassignedPlannedCost: In the plan currency.
    ActivitySummary:
      addProperties:
        splitFromId:
          type: [string, "null"]
    ActivityCreate:
      describe:
        plannedCost: In the plan currency (its currency must equal the plan's).
    ActivityUpdate:
      describe:
        plannedCost: In the plan currency.
    ActivityDisplay:
      describe:
        description: The amounts in the reader's display currency, each converted once from the plan currency.
    ActivityTypeOption:
      addProperties:
        defaultPlannedCostUsd:
          description: The type's default as kept in Settings (USD), for the conversion note.
          oneOf:
            - $ref: "#/components/schemas/Money"
            - type: "null"
      describe:
        defaultPlannedCost: The default converted into the plan currency at the current rate (016 FR-016).
    LineItem:
      addProperties:
        plannedCostPlan:
          description: Planned cost in the plan currency at the current rates (016 FR-015).
          $ref: "#/components/schemas/Money"
    UnassignedBalance:
      describe:
        description: Activity planned cost − the line items' plan-currency planned costs, worked out in the plan currency (016 FR-015); display variants as D-213.
        assigned: Sum of the line items' planned costs in the plan currency.
    SpreadGrid:
      describe:
        description: The activity's line items by month in the plan currency (016 FR-015); in LineItemSection converted to the display currency cell by cell (D-213).
    AllWorkFilters:
      addProperties:
        planTypes:
          type: array
          items:
            $ref: "#/components/schemas/PlanType"
        planCurrencies:
          type: array
          items:
            type: string
        attributes:
          type: array
          items:
            $ref: "#/components/schemas/AllWorkAttributeFilter"
    AllWorkViewState:
      removeProperties: [year]
      addProperties:
        yearFrom:
          type: integer
        yearTo:
          type: integer
        comparePhased:
          type: boolean
        breakdown:
          oneOf:
            - $ref: "#/components/schemas/AllWorkBreakdownChoice"
            - type: "null"
      addEnum:
        view: [breakdown]
        period: [year]
    AllWorkResult:
      removeProperties: [year]
      addProperties:
        yearFrom:
          type: integer
        yearTo:
          type: integer
    AllWorkOptions:
      removeProperties: [year]
      addProperties:
        yearFrom:
          type: integer
        yearTo:
          type: integer
        planTypes:
          type: array
          items:
            $ref: "#/components/schemas/PlanType"
        planCurrencies:
          type: array
          description: Plan currencies of the plans in the range.
          items:
            type: string
        attributes:
          type: array
          description: Filterable Shell attributes, level by level, in Settings' order (016 FR-039).
          items:
            $ref: "#/components/schemas/AllWorkFilterableAttribute"
    AllWorkPlanOption:
      addProperties:
        year:
          type: integer
        planType:
          $ref: "#/components/schemas/PlanType"
        currency:
          type: string
    AllWorkRow:
      addProperties:
        year:
          type: integer
          description: Plans only - the plan's year.
        planType:
          $ref: "#/components/schemas/PlanType"
        phasedBudget:
          type: array
          description: Containers with comparePhased only - one per AllWorkResult.periods entry; null = not phased in that period.
          items:
            oneOf:
              - $ref: "#/components/schemas/Money"
              - type: "null"
        overPeriods:
          type: array
          description: Indexes of periods where planned cost is above phasedBudget.
          items:
            type: integer
      optional: [year, planType, phasedBudget, overPeriods]
    AllWorkPeriod:
      describe:
        key: 2026-01 … 2026-12, Q1-2026 … Q4-2026, 2026, other or noDates (016 FR-035).
