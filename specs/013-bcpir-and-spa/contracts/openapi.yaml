# SpaDimensionRow, SpaDimensionBreakdown, SpaLineItemRow, SpaActivityRow, SpaBudgetPanel, SpaPurchaseRequest,
# SpaProcurementPanel, SpaView — as merged in backend/api/openapi.yaml (search "SpaView"); fields per
# data-model.md §3.
#
# Additions (rule 4):
# - PlanSummary: required property `bcpir: boolean` ("BCPIR plan", 013 FR-002).
# - GET /api/v1/plans and the All work query (GET /api/v1/all-work, /export, /breakdown): query `bcpir` enum
#   [include, only, exclude], default include (013 FR-003).
# - AllWorkRow: optional `bcpir: boolean` (plans only). AllWorkFilters: `bcpir` with the same enum.
