      properties:
        lineId:
          type: string
        lineItemId:
          type: string
        hxKey:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        invoiced:
          $ref: "#/components/schemas/Money"
        closedAmount:
          $ref: "#/components/schemas/Money"
        released:
          $ref: "#/components/schemas/Money"
    PurchaseRequestClosePreview:
      type: object
      additionalProperties: false
