      type: object
      additionalProperties: false
      required: [purchaseRequest, approval]
      properties:
        purchaseRequest:
          $ref: "#/components/schemas/PurchaseRequestRow"
        approval:
          $ref: "#/components/schemas/PurchaseRequestApproval"
    LineItemPurchaseRequestRow:
      type: object
      additionalProperties: false
      required: [purchaseRequestId, name, status, changePending, lineId, amount, amountInLineItemCurrency, sentOn, poNumber, owner]
      properties:
        purchaseRequestId:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/PurchaseRequestStatus"
        changePending:
          type: boolean
        lineId:
          type: string
        amount:
          $ref: "#/components/schemas/Money"
        amountInLineItemCurrency:
          $ref: "#/components/schemas/Money"
        sentOn:
          type: [string, "null"]
          format: date
        poNumber:
          type: string
        owner:
          oneOf:
            - $ref: "#/components/schemas/PersonRef"
            - type: "null"
    LineItemPurchaseRequests:
      type: object
      additionalProperties: false
      required: [lineItemId, hxKey, plannedCost, requested, availableToRequest, purchaseRequests, create, notice]
      properties:
        lineItemId:
          type: string
        hxKey:
          type: string
        plannedCost:
          $ref: "#/components/schemas/Money"
        requested:
          $ref: "#/components/schemas/Money"
        availableToRequest:
          description: Negative when rates moved PR lines in other currencies above the planned cost.
          $ref: "#/components/schemas/Money"
        purchaseRequests:
          type: array
          description: The PRs the person can see that draw on the line item, newest first.
          items:
