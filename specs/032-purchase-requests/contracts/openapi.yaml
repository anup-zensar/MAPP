      required: [version]
      properties:
        version:
          type: integer
    PurchaseRequestApprovalActions:
      type: object
      additionalProperties: false
      required: [submit, resubmit, approve, decline, recall]
      properties:
        submit:
          $ref: "#/components/schemas/ActionAvailability"
        resubmit:
          $ref: "#/components/schemas/ActionAvailability"
        approve:
          $ref: "#/components/schemas/ActionAvailability"
        decline:
          $ref: "#/components/schemas/ActionAvailability"
        recall:
          $ref: "#/components/schemas/ActionAvailability"
    PurchaseRequestApprovalSection:
