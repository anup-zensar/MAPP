          $ref: "#/components/schemas/PurchaseRequestRoundKind"
        available:
          type: boolean
        reason:
          type: string
        ready:
          type: boolean
        problems:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseRequestProblem"
        workflow:
          oneOf:
